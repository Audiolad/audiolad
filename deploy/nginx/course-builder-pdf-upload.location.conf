# Required Nginx locations for Course Builder PDF lesson blocks.
# App limit is 10 MiB (`PUBLICATION_FILE_MAX_PDF_BYTES`). Multipart needs headroom.
#
# Live Timeweb default is `client_max_body_size 4m` (4,194,304 bytes). A 4.8 MB
# PDF is over that default and under the old 5 MiB app cap, so Nginx returns
# 413 HTML before Next.js. Client validation passes; the UI shows a generic
# error because the 413 body is not JSON.
#
# Do NOT raise the global 4m default. Audio already works at 50 MB because
# `/api/author/products/.../audio/.../upload` has a live 55m location.
#
# Must be applied inside the `server_name audiolad.ru` HTTPS server block on
# Timeweb (`/etc/nginx/sites-available/audiolad.ru`), same pattern as
# private-audio / author product audio. Without this apply, 8–9 MB PDFs
# will still 413 after the 10 MB app change.

# Create a file block (multipart PDF)
location ~ ^/api/author/products/[^/]+/course/lessons/[^/]+/blocks$ {
    client_max_body_size 12m;
    proxy_pass http://audiolad_next;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}

# Replace PDF on an existing file block (multipart)
location ~ ^/api/author/products/[^/]+/course/lessons/[^/]+/blocks/[^/]+$ {
    client_max_body_size 12m;
    proxy_pass http://audiolad_next;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}
