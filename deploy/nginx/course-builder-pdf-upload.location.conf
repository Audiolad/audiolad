# Required Nginx locations for Course Builder PDF lesson blocks.
# App limit is 10 MB (`PUBLICATION_FILE_MAX_PDF_BYTES`). Multipart needs headroom.
# Without these blocks, requests fall through to the server default
# `client_max_body_size 4m` and Nginx returns 413 before Next.js runs.
# That is why a valid ~4.8 MB PDF fails in production while small PDFs work.
#
# Audio is a different path (`/api/author/products/.../audio/.../upload`) and
# already has its own 55m location. Do not change audio, cover, or the
# server-wide default here.
#
# Apply inside the `server_name audiolad.ru` HTTPS server block
# (same pattern as private-audio / author product audio uploads).

# Create a file block (multipart PDF)
location ~ ^/api/author/products/[^/]+/course/lessons/[^/]+/blocks$ {
    client_max_body_size 12m;
    proxy_pass http://audiolad_next;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}

# Replace PDF on an existing file block (multipart)
location ~ ^/api/author/products/[^/]+/course/lessons/[^/]+/blocks/[^/]+$ {
    client_max_body_size 12m;
    proxy_pass http://audiolad_next;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}
