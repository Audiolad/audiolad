# Hashed Next.js assets accumulated across releases.
# Live include: /etc/nginx/snippets/audiolad-next-static-overlay.conf
# Request /_next/static/chunks/x.css → shared/next-static/chunks/x.css
# Missing hashes fall back to the active Next process.
#
# gzip off: dynamic gzip on this alias would turn Range 206 into 200.
# gzip_static serves precompressed .gz siblings written after overlay copy.

location ^~ /_next/static/ {
    alias /var/www/audiolad-deploy/shared/next-static/;
    add_header Cache-Control "public, max-age=31536000, immutable";
    gzip off;
    gzip_static on;
    gzip_vary on;
    access_log off;
    error_page 404 = @audiolad_next_static_fallback;
}

location @audiolad_next_static_fallback {
    proxy_pass http://audiolad_next;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection 'upgrade';
    proxy_cache_bypass $http_upgrade;
}
