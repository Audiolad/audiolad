# Required Nginx locations for listener private audio uploads.
# Product audio limit: 50 MiB (+ multipart overhead). Cover limit: 5 MiB.
# Without these blocks, requests fall through to the server default
# `client_max_body_size 4m` and Nginx returns 413 before Next.js runs.
#
# Apply inside the `server_name audiolad.ru` HTTPS server block
# (same pattern as personal-materials / author product audio uploads).

# Create private audio item (multipart MP3 + optional cover)
location = /api/my-library/private-audio {
    client_max_body_size 55m;
    proxy_pass http://audiolad_next;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}

# Replace cover on an existing private audio item
location ~ ^/api/my-library/private-audio/[^/]+/cover$ {
    client_max_body_size 6m;
    proxy_pass http://audiolad_next;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}
