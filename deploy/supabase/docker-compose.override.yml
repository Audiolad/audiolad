# Production Supabase compose override for Audiolad.
# Installed on the host as /opt/supabase/docker/docker-compose.override.yml.
# Existing containers keep their current config until they are recreated.
services:
  studio:
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"
  kong:
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"
  auth:
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"
  rest:
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"
  realtime:
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"
  storage:
    # Issue #776: self-hosted storage-api defaults signed-upload JWT TTL to 60s.
    # Music WAV masters (up to 300 MiB) and concurrent album uploads need the
    # hosted-Supabase default of 7200s. Also set in docker-compose.yml / .env.
    environment:
      UPLOAD_SIGNED_URL_EXPIRATION_TIME: "7200"
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"
  imgproxy:
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"
  meta:
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"
  functions:
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"
  db:
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"
  supavisor:
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"
  templates-server:
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"
