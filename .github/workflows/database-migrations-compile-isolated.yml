name: Database Migrations Real Compile

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/database-migrations-compile-isolated.yml"
      - "scripts/database-migrations-compile-isolated.mjs"
      - "scripts/database-migrations-compile-workflow-unit.mjs"
      - "scripts/lib/supabase-compile-prerequisites.sql"
      - "scripts/lib/supabase-compile-pre-unified-audio-seed.sql"
      - "supabase/baseline/**"
      - "supabase/migrations/**"
      - "supabase/tests/database_migrations_compile_analytics_smoke.sql"
      - "deploy/scripts/lib/database-migrations-plan.mjs"
      - "package.json"

permissions:
  contents: read

jobs:
  database-migrations-real-compile:
    name: Database Migrations Real Compile
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: supabase/postgres:15.14.1.171
        env:
          POSTGRES_PASSWORD: postgres
        options: >-
          --health-cmd "pg_isready -U supabase_admin -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 24
        ports:
          - 5432:5432
    steps:
      - uses: actions/checkout@v4
      - name: Verify disposable Supabase Postgres
        run: |
          set -euo pipefail
          psql --version
          pg_isready --host 127.0.0.1 --port 5432 --username supabase_admin --dbname postgres
      - name: Execute real migration compile
        env:
          AUDIOLAD_MIGRATION_COMPILE_ADMIN_URL: postgresql://supabase_admin:postgres@127.0.0.1:5432/postgres
          PGPASSWORD: postgres
        run: node scripts/database-migrations-compile-isolated.mjs
