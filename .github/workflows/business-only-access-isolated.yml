name: Business Only Access Isolated SQL

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/business-only-access-isolated.yml"
      - "scripts/business-only-access-isolated.py"
      - "src/lib/products/business-only.ts"
      - "supabase/migrations/**"
      - "supabase/rollback/**"
      - "package.json"

permissions:
  contents: read

jobs:
  business-only-access-isolated:
    name: Business Only Access Isolated SQL
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Local PostgreSQL toolchain
        run: |
          set -euo pipefail
          ls -d /usr/lib/postgresql/*/bin
          psql --version
      - name: Business only access harness
        run: |
          set -euo pipefail
          python3 scripts/business-only-access-isolated.py | tee harness.log
          grep -q 'business-only-access-isolated:.*PASS' harness.log
          grep -q 'RLS verification: actual RLS SELECT via Unix socket, TCP disabled' harness.log
