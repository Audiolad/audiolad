name: PR Repository Validation

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

concurrency:
  group: pr-repository-validation-pull-request-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  pr-repository-validation:
    name: PR Repository Validation
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: audiolad_migration_test
          POSTGRES_PASSWORD: postgres
        options: >-
          --health-cmd "pg_isready -U postgres -d audiolad_migration_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    steps:
      - name: Materialize validated PR tree without checkout
        env:
          PR_SHA: ${{ github.event.pull_request.head.sha }}
          PR_CLONE_URL: ${{ github.event.pull_request.head.repo.clone_url }}
        run: |
          set -euo pipefail
          if [[ ! "$PR_SHA" =~ ^[0-9a-fA-F]{40}$ ]]; then
            echo "PR head SHA is malformed" >&2
            exit 1
          fi
          if [[ ! "$PR_CLONE_URL" =~ ^https://github\.com/ ]]; then
            echo "PR head clone URL is invalid" >&2
            exit 1
          fi
          OBJECT_STORE="$(mktemp -d)"
          PR_WORKSPACE="$(mktemp -d)"
          git -C "${OBJECT_STORE}" init --quiet
          git -C "${OBJECT_STORE}" fetch --no-tags "${PR_CLONE_URL}" "${PR_SHA}"
          git -C "${OBJECT_STORE}" cat-file -e "${PR_SHA}^{commit}"
          git -C "${OBJECT_STORE}" archive "${PR_SHA}" | tar -x -C "${PR_WORKSPACE}"
          printf 'OBJECT_STORE=%s\n' "${OBJECT_STORE}" >> "${GITHUB_ENV}"
          printf 'PR_WORKSPACE=%s\n' "${PR_WORKSPACE}" >> "${GITHUB_ENV}"

      - name: Install dependencies
        working-directory: ${{ env.PR_WORKSPACE }}
        run: npm ci

      - name: Validate PR repository
        working-directory: ${{ env.PR_WORKSPACE }}
        env:
          AUDIOLAD_TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/audiolad_migration_test
        run: |
          npm run test:database-migrations:ci
          npm run build
          npm run typecheck
          npm run lint

      - name: Remove PR temporary stores
        if: always()
        run: rm -rf "${OBJECT_STORE}" "${PR_WORKSPACE}"
