name: PR Repository Validation

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

concurrency:
  group: pr-repository-validation-pull-request-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  pr-repository-validation:
    name: PR Repository Validation
    runs-on: ubuntu-latest
    services:
      postgres:
        image: supabase/postgres:15.14.1.171
        env:
          POSTGRES_PASSWORD: postgres
        options: >-
          --health-cmd "pg_isready -U supabase_admin -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 24
        ports:
          - 5432:5432
    steps:
      - name: Materialize validated PR tree without checkout
        env:
          PR_SHA: ${{ github.event.pull_request.head.sha }}
          PR_CLONE_URL: ${{ github.event.pull_request.head.repo.clone_url }}
        run: |
          set -euo pipefail
          if [[ ! "$PR_SHA" =~ ^[0-9a-fA-F]{40}$ ]]; then
            echo "PR head SHA is malformed" >&2
            exit 1
          fi
          if [[ ! "$PR_CLONE_URL" =~ ^https://github\.com/ ]]; then
            echo "PR head clone URL is invalid" >&2
            exit 1
          fi
          OBJECT_STORE="$(mktemp -d)"
          PR_WORKSPACE="$(mktemp -d)"
          git -C "${OBJECT_STORE}" init --quiet
          git -C "${OBJECT_STORE}" fetch --no-tags "${PR_CLONE_URL}" "${PR_SHA}"
          git -C "${OBJECT_STORE}" cat-file -e "${PR_SHA}^{commit}"
          git -C "${OBJECT_STORE}" archive "${PR_SHA}" | tar -x -C "${PR_WORKSPACE}"
          printf 'OBJECT_STORE=%s\n' "${OBJECT_STORE}" >> "${GITHUB_ENV}"
          printf 'PR_WORKSPACE=%s\n' "${PR_WORKSPACE}" >> "${GITHUB_ENV}"

      - name: Install dependencies
        working-directory: ${{ env.PR_WORKSPACE }}
        run: npm ci

      - name: Validate PR repository
        working-directory: ${{ env.PR_WORKSPACE }}
        env:
          AUDIOLAD_ANALYTICS_P2_DATABASE_URL: postgresql://supabase_admin:postgres@127.0.0.1:5432/postgres
          PGPASSWORD: postgres
        run: |
          pg_isready --host 127.0.0.1 --port 5432 --username supabase_admin --dbname postgres
          npm run test:password-recovery
          npm run test:database-migrations:ci
          npm run test:studio-render-worker-env
          npm run test:production-pr-safety
          npm run test:production-deploy-gha
          npm run test:author-product-price-input
          npm run test:platform-analytics-p2
          npm run test:seo-core-v1
          npm run test:seo-wordstat-intake
          npm run test:wordstat
          npm run test:seo-query-analysis
          npm run test:author-published-product-seo-link
          npm run test:author-create-seo-query-step
          npm run test:author-seo-discovery
          npm run test:seo-discovery-ranking
          npm run test:product-seo-quality-review
          npm run test:music-product-rollout
          npm run test:seo-reservation-link-music-gate
          npm run test:author-product-aurafon-music-wizard
          npm run test:author-product-aurafon-catalog-section
          npx tsx scripts/author-email-outbox-cycle-unit.mts
          npm run build
          npm run typecheck
          npm run lint

      - name: Remove PR temporary stores
        if: always()
        run: rm -rf "${OBJECT_STORE}" "${PR_WORKSPACE}"
