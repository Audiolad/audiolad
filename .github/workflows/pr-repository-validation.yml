name: PR Repository Validation

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

concurrency:
  group: pr-repository-validation-pull-request-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  pr-repository-validation:
    name: PR Repository Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR head for ordinary validation
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Install dependencies
        run: npm ci

      - name: Validate PR repository
        run: |
          npm run test:database-migrations
          npm run build
          npm run typecheck
          npm run lint
