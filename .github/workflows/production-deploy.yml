# Manual one-click production deploy. Does not run on push/PR/schedule.
# Remote command is only: sudo -n /usr/local/sbin/audiolad-deploy <40-char-sha>
# That wrapper launches the existing run-from-target-sha.sh -> deploy.sh path.
# Smoke failure still blocks cutover. This workflow does not set
# AUDIOLAD_DEPLOY_OVERRIDE and does not deploy by being merged.
# SHA resolution fetches origin/main objects only; no working-tree checkout.
#
# confirm=DO_NOT_DEPLOY runs read-only production diagnostics (systemd/journal/log
# plus a fixed Studio render-worker env block). No arbitrary remote command input.
# confirm=OPS_STUDIO_WORKER_RECOVER is ops-only: clean-restart the Studio render
# worker as deploy. It never calls audiolad-deploy / deploy.sh and never does
# nginx or current/previous symlink cutover. Remote bash is hardcoded.
# Env-ready acceptance reads only bytes appended after saved PM2 log offsets.
# confirm=OPS_DISK_STORAGE_AUDIT is ops-only read-only disk/Storage cleanup
# AUDIT. No deletes, no cutover, no audiolad-deploy. Remote bash is hardcoded.
# confirm=OPS_DISK_STORAGE_CLEANUP is a one-shot hardcoded allowlist cleanup of
# the 13 SAFE TO DELETE items from audit run 34113627251. No cutover, no
# audiolad-deploy, no arbitrary remote shell input. Remote bash is hardcoded.
# confirm=OPS_STUDIO_DUPLICATE_ASSET_DIAG is ops-only read-only Studio
# duplicate-asset diagnostic: single-project probe plus global broken
# shared-ref scan and duplication audit. No writes, no signed URLs, no
# cutover, no audiolad-deploy. Remote bash is hardcoded.
# confirm=DEPLOY runs the canonical deploy path only.
#
# Environment protection: GitHub Environment `production` typically allows only
# refs on the default branch. DO_NOT_DEPLOY / OPS_STUDIO_WORKER_RECOVER /
# OPS_DISK_STORAGE_AUDIT / OPS_DISK_STORAGE_CLEANUP /
# OPS_STUDIO_DUPLICATE_ASSET_DIAG from a PR branch may fail
# before any job steps (job steps=[]). After merge to main, dispatch those
# confirms from main. Do not weaken environment protection to allow PR-branch
# production access.
name: Production Deploy

on:
  workflow_dispatch:
    inputs:
      commit_sha:
        description: "Optional 40-char lowercase hex SHA. Empty = origin/main tip."
        required: false
        type: string
        default: ""
      confirm:
        description: "DEPLOY starts production deploy. DO_NOT_DEPLOY runs read-only diagnostics. OPS_STUDIO_WORKER_RECOVER clean-restarts the Studio render worker with no cutover. OPS_DISK_STORAGE_AUDIT is a read-only disk/Storage cleanup audit (no deletes). OPS_DISK_STORAGE_CLEANUP is a one-shot hardcoded allowlist cleanup of the 13 SAFE TO DELETE items from audit run 34113627251. OPS_STUDIO_DUPLICATE_ASSET_DIAG is a read-only Studio duplicate-asset diagnostic (single-project probe plus global broken shared refs and duplication audit; no writes, no signed URLs, no cutover)."
        required: true
        type: choice
        options:
          - DO_NOT_DEPLOY
          - OPS_STUDIO_WORKER_RECOVER
          - OPS_DISK_STORAGE_AUDIT
          - OPS_DISK_STORAGE_CLEANUP
          - OPS_STUDIO_DUPLICATE_ASSET_DIAG
          - DEPLOY

permissions:
  contents: read

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  resolve:
    name: Resolve target SHA
    runs-on: ubuntu-latest
    outputs:
      target_sha: ${{ steps.target.outputs.target_sha }}
      origin_main_sha: ${{ steps.target.outputs.origin_main_sha }}
    steps:
      - name: Resolve target SHA
        id: target
        env:
          INPUT_COMMIT_SHA: ${{ inputs.commit_sha }}
        run: |
          set -euo pipefail

          OBJECT_STORE="$(mktemp -d)"
          git -C "${OBJECT_STORE}" init --quiet
          git -C "${OBJECT_STORE}" remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          git -C "${OBJECT_STORE}" fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
          ORIGIN_MAIN_SHA="$(git -C "${OBJECT_STORE}" rev-parse refs/remotes/origin/main)"

          REQUESTED="$(printf '%s' "${INPUT_COMMIT_SHA}" | tr -d '[:space:]')"
          if [[ -z "${REQUESTED}" ]]; then
            TARGET_SHA="${ORIGIN_MAIN_SHA}"
          else
            TARGET_SHA="${REQUESTED}"
          fi

          if [[ ! "${TARGET_SHA}" =~ ^[0-9a-f]{40}$ ]]; then
            echo "commit_sha must be a 40-character lowercase hex SHA" >&2
            exit 1
          fi

          git -C "${OBJECT_STORE}" cat-file -e "${TARGET_SHA}^{commit}"
          if ! git -C "${OBJECT_STORE}" merge-base --is-ancestor "${TARGET_SHA}" "${ORIGIN_MAIN_SHA}"; then
            echo "ERROR: ${TARGET_SHA} is not an ancestor of origin/main (${ORIGIN_MAIN_SHA})" >&2
            exit 1
          fi

          echo "requested SHA: ${TARGET_SHA}"
          echo "origin/main SHA: ${ORIGIN_MAIN_SHA}"
          echo "target_sha=${TARGET_SHA}" >> "${GITHUB_OUTPUT}"
          echo "origin_main_sha=${ORIGIN_MAIN_SHA}" >> "${GITHUB_OUTPUT}"

  diagnose:
    name: Production read-only diagnostics
    needs: resolve
    if: inputs.confirm == 'DO_NOT_DEPLOY'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Prepare SSH identity
        env:
          PRODUCTION_SSH_PRIVATE_KEY: ${{ secrets.PRODUCTION_SSH_PRIVATE_KEY }}
          PRODUCTION_SSH_KNOWN_HOSTS: ${{ secrets.PRODUCTION_SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          set +x
          : "${PRODUCTION_SSH_PRIVATE_KEY:?PRODUCTION_SSH_PRIVATE_KEY secret is required}"
          : "${PRODUCTION_SSH_KNOWN_HOSTS:?PRODUCTION_SSH_KNOWN_HOSTS secret is required}"
          umask 077
          SSH_DIR="$(mktemp -d)"
          KEY_FILE="${SSH_DIR}/id"
          HOSTS_FILE="${SSH_DIR}/known_hosts"
          printf '%s\n' "${PRODUCTION_SSH_PRIVATE_KEY}" > "${KEY_FILE}"
          printf '%s\n' "${PRODUCTION_SSH_KNOWN_HOSTS}" > "${HOSTS_FILE}"
          chmod 0600 "${KEY_FILE}" "${HOSTS_FILE}"
          echo "SSH_DIR=${SSH_DIR}" >> "${GITHUB_ENV}"
          echo "SSH_KEY_FILE=${KEY_FILE}" >> "${GITHUB_ENV}"
          echo "SSH_KNOWN_HOSTS_FILE=${HOSTS_FILE}" >> "${GITHUB_ENV}"

      - name: Read-only reconcile diagnostics via SSH
        env:
          PRODUCTION_SSH_HOST: ${{ secrets.PRODUCTION_SSH_HOST }}
          PRODUCTION_SSH_PORT: ${{ secrets.PRODUCTION_SSH_PORT }}
          PRODUCTION_SSH_USER: ${{ secrets.PRODUCTION_SSH_USER }}
          TARGET_SHA: ${{ needs.resolve.outputs.target_sha }}
          ORIGIN_MAIN_SHA: ${{ needs.resolve.outputs.origin_main_sha }}
        run: |
          set -euo pipefail
          : "${PRODUCTION_SSH_HOST:?PRODUCTION_SSH_HOST secret is required}"
          : "${PRODUCTION_SSH_PORT:?PRODUCTION_SSH_PORT secret is required}"
          : "${PRODUCTION_SSH_USER:?PRODUCTION_SSH_USER secret is required}"

          ssh \
            -i "${SSH_KEY_FILE}" \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o UserKnownHostsFile="${SSH_KNOWN_HOSTS_FILE}" \
            -o StrictHostKeyChecking=yes \
            -p "${PRODUCTION_SSH_PORT}" \
            -- \
            "${PRODUCTION_SSH_USER}@${PRODUCTION_SSH_HOST}" \
            "bash -s" "${TARGET_SHA}" "${ORIGIN_MAIN_SHA}" <<'REMOTE'
          set -euo pipefail
          TARGET_SHA="$1"
          ORIGIN_MAIN_SHA="$2"
          shift 2

          UNIT_SERVICE="audiolad-author-appreciation-getcourse-reconcile.service"
          UNIT_TIMER="audiolad-author-appreciation-getcourse-reconcile.timer"
          LOG_FILE="/var/log/audiolad/author-appreciation-getcourse-reconcile.log"
          DEPLOY_COMMIT_FILE="/var/www/audiolad-deploy/current/.deploy-commit"
          COOLDOWN_FILE="/var/lib/audiolad/author-appreciation-getcourse-reconcile.stamp"

          redact_stream() {
            sed -E \
              -e 's/(GETCOURSE_API_KEY=).*/\1***/g' \
              -e 's/(GETCOURSE_CALLBACK_SECRET=).*/\1***/g' \
              -e 's/(SUPABASE_SERVICE_ROLE_KEY=).*/\1***/g' \
              -e 's/[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\.[A-Za-z]{2,}/[redacted-email]/g'
          }

          section() {
            printf '\n===== %s =====\n' "$1"
          }

          try_cmd() {
            local label="$1"
            shift
            section "${label}"
            if "$@" 2>&1 | redact_stream; then
              return 0
            fi
            local code=$?
            printf 'BLOCKED exit=%s label=%s\n' "$code" "$label"
            return 0
          }

          section "DIAGNOSTIC_MODE"
          echo "mode=read_only"
          echo "audiolad_deploy=NOT_INVOKED"

          section "REQUESTED_SHAS"
          echo "workflow_target_sha=${TARGET_SHA}"
          echo "workflow_origin_main_sha=${ORIGIN_MAIN_SHA}"

          section "PRODUCTION_RELEASE"
          if [[ -r "${DEPLOY_COMMIT_FILE}" ]]; then
            tr -d '[:space:]' < "${DEPLOY_COMMIT_FILE}"
          else
            echo "deploy_commit_unreadable path=${DEPLOY_COMMIT_FILE}"
          fi

          section "PUBLIC_HEALTH_BUILD"
          curl -fsS https://audiolad.ru/api/health/build 2>&1 | redact_stream || echo "health_build_fetch_failed"

          try_cmd "TIMER_IS_ACTIVE" systemctl is-active "${UNIT_TIMER}"
          try_cmd "TIMER_IS_ENABLED" systemctl is-enabled "${UNIT_TIMER}"
          try_cmd "TIMER_SHOW" systemctl show "${UNIT_TIMER}" \
            -p ActiveState -p UnitFileState -p NextElapseUSecRealtime -p LastTriggerUSec \
            -p Triggers -p Unit
          try_cmd "TIMER_LIST" systemctl list-timers "${UNIT_TIMER}" --all --no-pager
          try_cmd "SERVICE_SHOW" systemctl show "${UNIT_SERVICE}" \
            -p ActiveState -p Result -p ExecMainStatus -p ExecMainCode \
            -p ExecMainStartTimestamp -p ExecMainExitTimestamp -p ExecMainPID \
            -p InvocationID -p StateChangeTimestamp
          try_cmd "SERVICE_STATUS" systemctl status "${UNIT_SERVICE}" --no-pager -l
          try_cmd "JOURNAL_SERVICE_TAIL" journalctl -u "${UNIT_SERVICE}" -n 80 --no-pager
          try_cmd "JOURNAL_TIMER_TAIL" journalctl -u "${UNIT_TIMER}" -n 40 --no-pager

          section "RECONCILE_COOLDOWN_STAMP"
          if [[ -r "${COOLDOWN_FILE}" ]]; then
            echo -n "cooldown_last_started_ms="
            tr -d '[:space:]' < "${COOLDOWN_FILE}"
            echo
          else
            echo "cooldown_stamp_unreadable path=${COOLDOWN_FILE}"
          fi

          section "RECONCILE_LOG_FILE"
          if [[ -r "${LOG_FILE}" ]]; then
            tail -n 120 "${LOG_FILE}" | redact_stream
          else
            echo "log_unreadable path=${LOG_FILE}"
          fi

          section "RECONCILE_LOG_SUMMARY"
          if [[ -r "${LOG_FILE}" ]]; then
            awk '/APPRECIATION_RECONCILE |attempted=|author_appreciation_getcourse_reconcile/' "${LOG_FILE}" \
              | tail -n 40 \
              | redact_stream
          fi

          section "WRAPPER_SCRIPT_HEAD"
          WRAPPER="/usr/local/lib/audiolad/run-author-appreciation-getcourse-reconcile.sh"
          if [[ -r "${WRAPPER}" ]]; then
            head -n 120 "${WRAPPER}" | redact_stream
          else
            echo "wrapper_unreadable path=${WRAPPER}"
          fi

          # Fixed Studio render-worker env diagnostic. Paths and commands are
          # hardcoded. Never print env file contents or secret values.
          DEPLOY_ROOT="/var/www/audiolad-deploy"
          CURRENT_LINK="${DEPLOY_ROOT}/current"
          SHARED_ENV_PRODUCTION="${DEPLOY_ROOT}/shared/.env.production"
          PM2_APP_NAME="audiolad-studio-render-worker"

          redact_studio_stream() {
            redact_stream | sed -E \
              -e 's#https?://[^[:space:]\"'\'']+#[redacted-url]#g' \
              -e 's/eyJ[A-Za-z0-9_-]+\.[A-Za-z0-9_-]+\.[A-Za-z0-9_-]+/[redacted-jwt]/g'
          }

          can_read_flag() {
            local name="$1"
            local path="$2"
            if test -r "${path}"; then
              printf 'DEPLOY_CAN_READ_%s=YES\n' "${name}"
            else
              printf 'DEPLOY_CAN_READ_%s=NO\n' "${name}"
            fi
          }

          diagnose_env_path() {
            local label="$1"
            local path="$2"
            local real=""
            section "STUDIO_RENDER_WORKER_ENV_${label}"
            echo "path=${path}"
            if [[ -L "${path}" ]]; then
              echo "exists=YES"
              echo "symlink=YES"
              echo "symlink_target=$(readlink "${path}")"
              if real="$(readlink -f "${path}")" && [[ -n "${real}" && -e "${real}" ]]; then
                echo "realpath=${real}"
              else
                echo "realpath=BROKEN"
              fi
            elif [[ -e "${path}" ]]; then
              echo "exists=YES"
              echo "symlink=NO"
              if real="$(readlink -f "${path}")" && [[ -n "${real}" ]]; then
                echo "realpath=${real}"
              else
                echo "realpath=BROKEN"
              fi
            else
              echo "exists=NO"
              echo "symlink=NO"
              echo "realpath=BROKEN"
            fi
            if [[ -e "${path}" || -L "${path}" ]]; then
              if STAT="$(stat -c 'stat_owner=%U stat_group=%G stat_mode=%a' "${path}")"; then
                printf '%s\n' "${STAT}"
              else
                echo "stat_failed"
              fi
            fi
            if [[ -n "${real}" && -e "${real}" ]]; then
              if TARGET_STAT="$(stat -c 'target_stat_owner=%U target_stat_group=%G target_stat_mode=%a' "${real}")"; then
                printf '%s\n' "${TARGET_STAT}"
              else
                echo "target_stat_failed"
              fi
            fi
          }

          print_pm2_safe_fields() {
            python3 -c '
          import json, sys
          name = "audiolad-studio-render-worker"
          try:
              procs = json.load(sys.stdin)
          except Exception:
              print("pm2_jlist_unreadable")
              raise SystemExit(0)
          if not isinstance(procs, list):
              print("pm2_jlist_unreadable")
              raise SystemExit(0)
          found = False
          for proc in procs:
              if not isinstance(proc, dict) or proc.get("name") != name:
                  continue
              found = True
              env = proc.get("pm2_env") if isinstance(proc.get("pm2_env"), dict) else {}
              cron = env.get("cron_restart")
              print("name=%s" % name)
              print("status=%s" % env.get("status", ""))
              print("restarts=%s" % env.get("restart_time", ""))
              print("unstable_restarts=%s" % env.get("unstable_restarts", ""))
              print("cron_restart=%s" % ("none" if cron in (None, "") else cron))
              print("autorestart=%s" % env.get("autorestart", ""))
              print("cwd=%s" % env.get("pm_cwd", ""))
              print("out_log=%s" % env.get("pm_out_log_path", ""))
              print("error_log=%s" % env.get("pm_err_log_path", ""))
          if not found:
              print("pm2_process_not_found name=%s" % name)
          '
          }

          filter_worker_log_lines() {
            awk '/studio_render_env_ready|environment_missing|hasNextPublic|hasSupabase|redacted/'
          }

          run_loadenv_probe() {
            local label="$1"
            local dir="$2"
            local probe=""
            local output=""
            local code=0
            local printed_url=0
            local printed_key=0
            local line=""
            section "STUDIO_RENDER_WORKER_LOADENV_${label}"
            echo "dir=${dir}"
            if [[ ! -d "${dir}" ]]; then
              echo "dir_missing"
              echo "HAS_NEXT_PUBLIC_SUPABASE_URL=false"
              echo "HAS_SUPABASE_SERVICE_ROLE_KEY=false"
              return 0
            fi
            probe="$(mktemp)"
            cat >"${probe}" <<'JS'
          const silent = { info() {}, error() {} };
          const dir = process.argv[2];
          delete process.env.NEXT_PUBLIC_SUPABASE_URL;
          delete process.env.SUPABASE_SERVICE_ROLE_KEY;
          const { loadEnvConfig } = require("@next/env");
          loadEnvConfig(dir, false, silent, true);
          const hasUrl = Boolean(process.env.NEXT_PUBLIC_SUPABASE_URL);
          const hasKey = Boolean(process.env.SUPABASE_SERVICE_ROLE_KEY);
          delete process.env.NEXT_PUBLIC_SUPABASE_URL;
          delete process.env.SUPABASE_SERVICE_ROLE_KEY;
          console.log("HAS_NEXT_PUBLIC_SUPABASE_URL=" + hasUrl);
          console.log("HAS_SUPABASE_SERVICE_ROLE_KEY=" + hasKey);
          JS
            set +e
            output="$(
              unset NEXT_PUBLIC_SUPABASE_URL SUPABASE_SERVICE_ROLE_KEY
              export NODE_ENV=production
              export NODE_PATH="${dir}/node_modules${NODE_PATH:+:${NODE_PATH}}"
              cd "${dir}"
              node "${probe}" "${dir}" 2>/dev/null
            )"
            code=$?
            set -e
            rm -f "${probe}"
            if [[ "${code}" -ne 0 ]]; then
              echo "loadenv_probe_failed exit=${code}"
              echo "HAS_NEXT_PUBLIC_SUPABASE_URL=false"
              echo "HAS_SUPABASE_SERVICE_ROLE_KEY=false"
              return 0
            fi
            printed_url=0
            printed_key=0
            while IFS= read -r line; do
              case "${line}" in
                HAS_NEXT_PUBLIC_SUPABASE_URL=true|HAS_NEXT_PUBLIC_SUPABASE_URL=false)
                  printf '%s\n' "${line}"
                  printed_url=1
                  ;;
                HAS_SUPABASE_SERVICE_ROLE_KEY=true|HAS_SUPABASE_SERVICE_ROLE_KEY=false)
                  printf '%s\n' "${line}"
                  printed_key=1
                  ;;
              esac
            done <<< "${output}"
            if [[ "${printed_url}" -eq 0 ]]; then
              echo "HAS_NEXT_PUBLIC_SUPABASE_URL=false"
            fi
            if [[ "${printed_key}" -eq 0 ]]; then
              echo "HAS_SUPABASE_SERVICE_ROLE_KEY=false"
            fi
          }

          section "STUDIO_RENDER_WORKER_ENV_DIAGNOSTIC"
          echo "mode=read_only"
          echo "audiolad_deploy=NOT_INVOKED"
          echo "ssh_user=$(id -un)"

          section "STUDIO_RENDER_WORKER_CURRENT_RELEASE"
          if CURRENT_REAL="$(readlink -f "${CURRENT_LINK}")" && [[ -n "${CURRENT_REAL}" ]]; then
            echo "current_link=${CURRENT_LINK}"
            echo "current_realpath=${CURRENT_REAL}"
            echo "CURRENT RELEASE=$(basename "${CURRENT_REAL}")"
          else
            CURRENT_REAL=""
            echo "current_link=${CURRENT_LINK}"
            echo "current_realpath=BROKEN"
            echo "CURRENT RELEASE=UNKNOWN"
          fi

          CURRENT_ENV_PRODUCTION="${CURRENT_LINK}/.env.production"
          CURRENT_ENV_LOCAL="${CURRENT_LINK}/.env.local"
          diagnose_env_path "CURRENT_ENV_PRODUCTION" "${CURRENT_ENV_PRODUCTION}"
          diagnose_env_path "CURRENT_ENV_LOCAL" "${CURRENT_ENV_LOCAL}"
          diagnose_env_path "SHARED_ENV_PRODUCTION" "${SHARED_ENV_PRODUCTION}"

          try_cmd "STUDIO_RENDER_WORKER_NAMEI_CURRENT_ENV_PRODUCTION" namei -l "${CURRENT_ENV_PRODUCTION}"
          try_cmd "STUDIO_RENDER_WORKER_NAMEI_CURRENT_ENV_LOCAL" namei -l "${CURRENT_ENV_LOCAL}"
          try_cmd "STUDIO_RENDER_WORKER_NAMEI_SHARED_ENV_PRODUCTION" namei -l "${SHARED_ENV_PRODUCTION}"

          section "STUDIO_RENDER_WORKER_DEPLOY_CAN_READ"
          can_read_flag "CURRENT_ENV_PRODUCTION" "${CURRENT_ENV_PRODUCTION}"
          can_read_flag "CURRENT_ENV_LOCAL" "${CURRENT_ENV_LOCAL}"
          can_read_flag "SHARED_ENV_PRODUCTION" "${SHARED_ENV_PRODUCTION}"

          section "STUDIO_RENDER_WORKER_PM2"
          PM2_SAFE=""
          if command -v pm2 >/dev/null 2>&1 && command -v python3 >/dev/null 2>&1; then
            set +e
            PM2_SAFE="$(pm2 jlist 2>/dev/null | print_pm2_safe_fields)"
            set -e
            if [[ -n "${PM2_SAFE}" ]]; then
              printf '%s\n' "${PM2_SAFE}" | redact_studio_stream
            else
              echo "pm2_jlist_failed"
            fi
          else
            echo "pm2_or_python3_not_found"
          fi

          if command -v pm2 >/dev/null 2>&1; then
            try_cmd "STUDIO_RENDER_WORKER_PM2_STATUS" pm2 status "${PM2_APP_NAME}"
          fi

          section "STUDIO_RENDER_WORKER_PM2_DESCRIBE"
          if command -v pm2 >/dev/null 2>&1; then
            set +e
            pm2 describe "${PM2_APP_NAME}" 2>&1 \
              | awk '/Divergent env variables/{exit} {print}' \
              | redact_studio_stream
            set -e
          else
            echo "pm2_not_found"
          fi

          section "STUDIO_RENDER_WORKER_PM2_LOGS"
          OUT_LOG="$(printf '%s\n' "${PM2_SAFE}" | awk -F= '/^out_log=/{print substr($0, index($0,"=")+1)}')"
          ERR_LOG="$(printf '%s\n' "${PM2_SAFE}" | awk -F= '/^error_log=/{print substr($0, index($0,"=")+1)}')"
          echo "out_log_path=${OUT_LOG:-unknown}"
          echo "error_log_path=${ERR_LOG:-unknown}"
          if [[ -n "${OUT_LOG}" && -r "${OUT_LOG}" ]]; then
            echo "out_log_filtered<<"
            tail -n 200 "${OUT_LOG}" | filter_worker_log_lines | redact_studio_stream
            echo ">>out_log_filtered"
          else
            echo "out_log_unreadable"
          fi
          if [[ -n "${ERR_LOG}" && -r "${ERR_LOG}" ]]; then
            echo "error_log_filtered<<"
            tail -n 200 "${ERR_LOG}" | filter_worker_log_lines | redact_studio_stream
            echo ">>error_log_filtered"
          else
            echo "error_log_unreadable"
          fi

          run_loadenv_probe "CWD" "${CURRENT_LINK}"
          if [[ -n "${CURRENT_REAL}" ]]; then
            run_loadenv_probe "REALPATH" "${CURRENT_REAL}"
          else
            section "STUDIO_RENDER_WORKER_LOADENV_REALPATH"
            echo "dir=BROKEN"
            echo "HAS_NEXT_PUBLIC_SUPABASE_URL=false"
            echo "HAS_SUPABASE_SERVICE_ROLE_KEY=false"
          fi

          try_cmd "STUDIO_RENDER_WORKER_SUDO_N_L" sudo -n -l

          section "DIAGNOSTIC_END"
          REMOTE

      - name: Remove SSH identity
        if: always()
        run: |
          set -euo pipefail
          if [[ -n "${SSH_DIR:-}" ]]; then
            rm -rf "${SSH_DIR}"
          fi

  studio_worker_recover:
    name: Ops Studio worker recover
    needs: resolve
    if: inputs.confirm == 'OPS_STUDIO_WORKER_RECOVER'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Prepare SSH identity
        env:
          PRODUCTION_SSH_PRIVATE_KEY: ${{ secrets.PRODUCTION_SSH_PRIVATE_KEY }}
          PRODUCTION_SSH_KNOWN_HOSTS: ${{ secrets.PRODUCTION_SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          set +x
          : "${PRODUCTION_SSH_PRIVATE_KEY:?PRODUCTION_SSH_PRIVATE_KEY secret is required}"
          : "${PRODUCTION_SSH_KNOWN_HOSTS:?PRODUCTION_SSH_KNOWN_HOSTS secret is required}"
          umask 077
          SSH_DIR="$(mktemp -d)"
          KEY_FILE="${SSH_DIR}/id"
          HOSTS_FILE="${SSH_DIR}/known_hosts"
          printf '%s\n' "${PRODUCTION_SSH_PRIVATE_KEY}" > "${KEY_FILE}"
          printf '%s\n' "${PRODUCTION_SSH_KNOWN_HOSTS}" > "${HOSTS_FILE}"
          chmod 0600 "${KEY_FILE}" "${HOSTS_FILE}"
          echo "SSH_DIR=${SSH_DIR}" >> "${GITHUB_ENV}"
          echo "SSH_KEY_FILE=${KEY_FILE}" >> "${GITHUB_ENV}"
          echo "SSH_KNOWN_HOSTS_FILE=${HOSTS_FILE}" >> "${GITHUB_ENV}"

      - name: Recover Studio render worker via SSH
        env:
          PRODUCTION_SSH_HOST: ${{ secrets.PRODUCTION_SSH_HOST }}
          PRODUCTION_SSH_PORT: ${{ secrets.PRODUCTION_SSH_PORT }}
          PRODUCTION_SSH_USER: ${{ secrets.PRODUCTION_SSH_USER }}
          TARGET_SHA: ${{ needs.resolve.outputs.target_sha }}
          ORIGIN_MAIN_SHA: ${{ needs.resolve.outputs.origin_main_sha }}
        run: |
          set -euo pipefail
          : "${PRODUCTION_SSH_HOST:?PRODUCTION_SSH_HOST secret is required}"
          : "${PRODUCTION_SSH_PORT:?PRODUCTION_SSH_PORT secret is required}"
          : "${PRODUCTION_SSH_USER:?PRODUCTION_SSH_USER secret is required}"

          ssh \
            -i "${SSH_KEY_FILE}" \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o UserKnownHostsFile="${SSH_KNOWN_HOSTS_FILE}" \
            -o StrictHostKeyChecking=yes \
            -p "${PRODUCTION_SSH_PORT}" \
            -- \
            "${PRODUCTION_SSH_USER}@${PRODUCTION_SSH_HOST}" \
            "bash -s" "${TARGET_SHA}" "${ORIGIN_MAIN_SHA}" <<'REMOTE_RECOVER'
          set -euo pipefail
          TARGET_SHA="$1"
          ORIGIN_MAIN_SHA="$2"
          shift 2

          # Hardcoded ops-only recover. Never invoke audiolad-deploy.
          # Operator/local equivalent:
          #   bash deploy/scripts/audiolad-studio-render-worker-recover.sh
          DEPLOY_ROOT="/var/www/audiolad-deploy"
          CURRENT_LINK="${DEPLOY_ROOT}/current"
          SHARED_ENV_PRODUCTION="${DEPLOY_ROOT}/shared/.env.production"
          PM2_APP_NAME="audiolad-studio-render-worker"
          ECOSYSTEM_REL="deploy/studio-render-worker.ecosystem.config.cjs"
          SURVIVE_SECONDS="${AUDIOLAD_STUDIO_WORKER_SURVIVE_SECONDS:-166}"
          ONLINE_TIMEOUT_SECONDS="${AUDIOLAD_STUDIO_WORKER_ONLINE_TIMEOUT_SECONDS:-60}"
          POLL_SECONDS="${AUDIOLAD_STUDIO_WORKER_POLL_SECONDS:-5}"
          ENV_BOOTSTRAP_SECONDS="${AUDIOLAD_STUDIO_WORKER_ENV_BOOTSTRAP_SECONDS:-30}"
          ENV_BOOTSTRAP_POLL_SECONDS="${AUDIOLAD_STUDIO_WORKER_ENV_BOOTSTRAP_POLL_SECONDS:-2}"
          DB_CONTAINER="${AUDIOLAD_SUPABASE_DB_CONTAINER:-supabase-db}"

          ENV_FILE_OWNER_GROUP_MODE=""
          DEPLOY_CAN_READ_ENV="NO"
          ENV_PERMISSIONS=""
          ACTIVE_RENDER_JOBS_BEFORE="UNKNOWN"
          WORKER_CLEAN_START="NO"
          FRESH_ENV_READY_LOG="NO"
          WORKER_RESTARTS="UNKNOWN"
          WORKER_PID=""
          RESTART_COUNT_STABLE="NO"
          SURVIVED_OVER_2_5_MIN="NO"
          RENDER_SMOKE="FAIL"
          ACCEPTANCE="FAILED"
          CUTOVER="NO"
          AUDIOLAD_DEPLOY="NOT_INVOKED"
          SAVED_OUT_LOG=""
          SAVED_ERR_LOG=""
          SAVED_OUT_OFFSET=0
          SAVED_ERR_OFFSET=0

          redact_stream() {
            sed -E \
              -e 's/(GETCOURSE_API_KEY=).*/\1***/g' \
              -e 's/(GETCOURSE_CALLBACK_SECRET=).*/\1***/g' \
              -e 's/(SUPABASE_SERVICE_ROLE_KEY=).*/\1***/g' \
              -e 's/[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\.[A-Za-z]{2,}/[redacted-email]/g'
          }

          redact_studio_stream() {
            redact_stream | sed -E \
              -e 's#https?://[^[:space:]\"'\'']+#[redacted-url]#g' \
              -e 's/eyJ[A-Za-z0-9_-]+\.[A-Za-z0-9_-]+\.[A-Za-z0-9_-]+/[redacted-jwt]/g'
          }

          section() {
            printf '\n===== %s =====\n' "$1"
          }

          print_final_flags() {
            printf '%s\n' "ENV PERMISSIONS = ${ENV_PERMISSIONS:-${ENV_FILE_OWNER_GROUP_MODE} READ=${DEPLOY_CAN_READ_ENV}}"
            printf '%s\n' "FRESH ENV READY LOG = ${FRESH_ENV_READY_LOG}"
            printf '%s\n' "WORKER CLEAN START = ${WORKER_CLEAN_START}"
            printf '%s\n' "RESTART COUNT STABLE = ${RESTART_COUNT_STABLE}"
            printf '%s\n' "SURVIVED >2.5 MIN = ${SURVIVED_OVER_2_5_MIN}"
            printf '%s\n' "RENDER SMOKE = ${RENDER_SMOKE}"
            printf '%s\n' "#353 PRODUCTION ACCEPTANCE = ${ACCEPTANCE}"
            printf '%s\n' "ACTIVE RENDER JOBS BEFORE = ${ACTIVE_RENDER_JOBS_BEFORE}"
            printf '%s\n' "CUTOVER = ${CUTOVER}"
            printf '%s\n' "CUTOVER=NO"
            printf '%s\n' "audiolad_deploy = ${AUDIOLAD_DEPLOY}"
          }

          fail_recover() {
            local message="$1"
            section "STUDIO_RENDER_WORKER_RECOVER_FAILED"
            printf '%s\n' "${message}" | redact_studio_stream
            ACCEPTANCE="FAILED"
            print_final_flags
            return 1
          }

          print_pm2_recover_fields() {
            python3 -c '
          import json, sys
          name = "audiolad-studio-render-worker"
          try:
              procs = json.load(sys.stdin)
          except Exception:
              print("status=missing")
              print("restart_time=")
              print("pid=")
              print("out_log=")
              print("error_log=")
              raise SystemExit(0)
          if not isinstance(procs, list):
              print("status=missing")
              print("restart_time=")
              print("pid=")
              print("out_log=")
              print("error_log=")
              raise SystemExit(0)
          for proc in procs:
              if not isinstance(proc, dict) or proc.get("name") != name:
                  continue
              env = proc.get("pm2_env") if isinstance(proc.get("pm2_env"), dict) else {}
              print("status=%s" % env.get("status", ""))
              print("restart_time=%s" % env.get("restart_time", ""))
              print("pid=%s" % proc.get("pid", env.get("pm_pid", "")))
              print("out_log=%s" % env.get("pm_out_log_path", ""))
              print("error_log=%s" % env.get("pm_err_log_path", ""))
              raise SystemExit(0)
          print("status=missing")
          print("restart_time=")
          print("pid=")
          print("out_log=")
          print("error_log=")
          '
          }

          read_pm2_recover_fields() {
            local raw=""
            if ! command -v pm2 >/dev/null 2>&1 || ! command -v python3 >/dev/null 2>&1; then
              printf '%s\n' "status=missing"
              printf '%s\n' "restart_time="
              printf '%s\n' "pid="
              printf '%s\n' "out_log="
              printf '%s\n' "error_log="
              return 0
            fi
            set +e
            raw="$(pm2 jlist 2>/dev/null | print_pm2_recover_fields)"
            set -e
            if [[ -z "${raw}" ]]; then
              printf '%s\n' "status=missing"
              printf '%s\n' "restart_time="
              printf '%s\n' "pid="
              printf '%s\n' "out_log="
              printf '%s\n' "error_log="
              return 0
            fi
            printf '%s\n' "${raw}" | redact_studio_stream
          }

          pm2_field() {
            local fields="$1"
            local key="$2"
            printf '%s\n' "${fields}" | awk -F= -v key="${key}" '$1==key {print substr($0, index($0,"=")+1); exit}'
          }

          filter_worker_log_lines() {
            awk '/studio_render_env_ready|environment_missing|hasNextPublic|hasSupabase|redacted/'
          }

          docker_bin() {
            if [[ -n "${AUDIOLAD_DOCKER_BIN:-}" ]]; then
              printf '%s\n' "${AUDIOLAD_DOCKER_BIN}"
              return 0
            fi
            if command -v docker >/dev/null 2>&1; then
              printf '%s\n' "docker"
              return 0
            fi
            return 1
          }

          count_active_studio_render_jobs_docker() {
            local bin=""
            local raw=""
            local code=0
            if ! bin="$(docker_bin)"; then
              return 1
            fi
            set +e
            raw="$(
              "${bin}" exec "${DB_CONTAINER}" \
                psql -U postgres -d postgres -tA -c \
                "SELECT count(*) FROM public.studio_render_jobs WHERE status IN ('queued', 'processing');"
            )"
            code=$?
            set -e
            raw="$(printf '%s' "${raw}" | tr -d '[:space:]')"
            if [[ "${code}" -eq 0 && "${raw}" =~ ^[0-9]+$ ]]; then
              printf '%s\n' "${raw}"
              return 0
            fi
            return 1
          }

          count_active_studio_render_jobs_node() {
            local dir="$1"
            local probe=""
            local output=""
            local code=0
            local line=""
            local count=""
            if [[ ! -d "${dir}" ]]; then
              return 1
            fi
            probe="$(mktemp)"
            cat >"${probe}" <<'JS'
          const silent = { info() {}, error() {} };
          const dir = process.argv[2];
          delete process.env.NEXT_PUBLIC_SUPABASE_URL;
          delete process.env.SUPABASE_SERVICE_ROLE_KEY;
          const { loadEnvConfig } = require("@next/env");
          loadEnvConfig(dir, false, silent, true);
          const url = process.env.NEXT_PUBLIC_SUPABASE_URL;
          const key = process.env.SUPABASE_SERVICE_ROLE_KEY;
          delete process.env.NEXT_PUBLIC_SUPABASE_URL;
          delete process.env.SUPABASE_SERVICE_ROLE_KEY;
          if (!url || !key) {
            console.log("ACTIVE_RENDER_JOBS_COUNT=UNAVAILABLE");
            process.exit(2);
          }
          const { createClient } = require("@supabase/supabase-js");
          const service = createClient(url, key, {
            auth: { autoRefreshToken: false, persistSession: false },
          });
          const timer = setTimeout(() => {
            console.log("ACTIVE_RENDER_JOBS_COUNT=UNAVAILABLE");
            process.exit(2);
          }, 20000);
          service
            .from("studio_render_jobs")
            .select("id", { count: "exact", head: true })
            .in("status", ["queued", "processing"])
            .then(({ count, error }) => {
              clearTimeout(timer);
              if (error || typeof count !== "number") {
                console.log("ACTIVE_RENDER_JOBS_COUNT=UNAVAILABLE");
                process.exit(2);
              }
              console.log("ACTIVE_RENDER_JOBS_COUNT=" + count);
            })
            .catch(() => {
              clearTimeout(timer);
              console.log("ACTIVE_RENDER_JOBS_COUNT=UNAVAILABLE");
              process.exit(2);
            });
          JS
            set +e
            output="$(
              unset NEXT_PUBLIC_SUPABASE_URL SUPABASE_SERVICE_ROLE_KEY
              export NODE_ENV=production
              export NODE_PATH="${dir}/node_modules${NODE_PATH:+:${NODE_PATH}}"
              cd "${dir}"
              node "${probe}" "${dir}" 2>/dev/null
            )"
            code=$?
            set -e
            rm -f "${probe}"
            while IFS= read -r line; do
              case "${line}" in
                ACTIVE_RENDER_JOBS_COUNT=[0-9]*)
                  count="${line#ACTIVE_RENDER_JOBS_COUNT=}"
                  ;;
              esac
            done <<< "${output}"
            if [[ "${code}" -eq 0 && "${count}" =~ ^[0-9]+$ ]]; then
              printf '%s\n' "${count}"
              return 0
            fi
            return 1
          }

          count_active_studio_render_jobs() {
            local count=""
            if count="$(count_active_studio_render_jobs_docker)"; then
              printf '%s\n' "${count}"
              return 0
            fi
            if count="$(count_active_studio_render_jobs_node "${CURRENT_LINK}")"; then
              printf '%s\n' "${count}"
              return 0
            fi
            return 1
          }

          run_safe_render_smoke() {
            local dir="${CURRENT_LINK}"
            local probe=""
            local output=""
            local code=0
            local line=""
            local result=""
            if [[ ! -d "${dir}" ]]; then
              return 1
            fi
            probe="$(mktemp)"
            cat >"${probe}" <<'JS'
          const silent = { info() {}, error() {} };
          const dir = process.argv[2];
          delete process.env.NEXT_PUBLIC_SUPABASE_URL;
          delete process.env.SUPABASE_SERVICE_ROLE_KEY;
          const { loadEnvConfig } = require("@next/env");
          loadEnvConfig(dir, false, silent, true);
          const url = process.env.NEXT_PUBLIC_SUPABASE_URL;
          const key = process.env.SUPABASE_SERVICE_ROLE_KEY;
          delete process.env.NEXT_PUBLIC_SUPABASE_URL;
          delete process.env.SUPABASE_SERVICE_ROLE_KEY;
          if (!url || !key) {
            console.log("RENDER_SMOKE=FAIL");
            process.exit(2);
          }
          const { createClient } = require("@supabase/supabase-js");
          const service = createClient(url, key, {
            auth: { autoRefreshToken: false, persistSession: false },
          });
          const timer = setTimeout(() => {
            console.log("RENDER_SMOKE=FAIL");
            process.exit(2);
          }, 20000);
          service.rpc("recover_stale_studio_render_jobs")
            .then((recover) => {
              if (recover.error) {
                console.log("RENDER_SMOKE=FAIL");
                process.exit(2);
              }
              return service
                .from("studio_render_jobs")
                .select("id", { count: "exact", head: true })
                .in("status", ["queued", "processing"]);
            })
            .then(({ count, error }) => {
              clearTimeout(timer);
              if (error || count !== 0) {
                console.log("RENDER_SMOKE=FAIL");
                process.exit(2);
              }
              console.log("RENDER_SMOKE=PASS");
            })
            .catch(() => {
              clearTimeout(timer);
              console.log("RENDER_SMOKE=FAIL");
              process.exit(2);
            });
          JS
            set +e
            output="$(
              unset NEXT_PUBLIC_SUPABASE_URL SUPABASE_SERVICE_ROLE_KEY
              export NODE_ENV=production
              export NODE_PATH="${dir}/node_modules${NODE_PATH:+:${NODE_PATH}}"
              cd "${dir}"
              node "${probe}" "${dir}" 2>/dev/null
            )"
            code=$?
            set -e
            rm -f "${probe}"
            output="$(printf '%s\n' "${output}" | redact_studio_stream)"
            while IFS= read -r line; do
              case "${line}" in
                RENDER_SMOKE=PASS|RENDER_SMOKE=FAIL)
                  result="${line#RENDER_SMOKE=}"
                  ;;
              esac
            done <<< "${output}"
            if [[ "${code}" -eq 0 && "${result}" == "PASS" ]]; then
              printf '%s\n' "PASS"
              return 0
            fi
            return 1
          }

          log_file_size() {
            local path="$1"
            if [[ -z "${path}" || ! -f "${path}" ]]; then
              printf '%s\n' "0"
              return 0
            fi
            stat -c '%s' "${path}" 2>/dev/null || printf '%s\n' "0"
          }

          save_log_offsets() {
            local fields="$1"
            SAVED_OUT_LOG="$(pm2_field "${fields}" "out_log")"
            SAVED_ERR_LOG="$(pm2_field "${fields}" "error_log")"
            SAVED_OUT_OFFSET="$(log_file_size "${SAVED_OUT_LOG}")"
            SAVED_ERR_OFFSET="$(log_file_size "${SAVED_ERR_LOG}")"
            echo "LOG OFFSETS saved out=${SAVED_OUT_LOG:-none}:${SAVED_OUT_OFFSET} err=${SAVED_ERR_LOG:-none}:${SAVED_ERR_OFFSET}"
          }

          read_appended_log() {
            local path="$1"
            local saved_path="$2"
            local saved_offset="$3"
            local size=0
            local offset=0
            if [[ -z "${path}" || ! -r "${path}" ]]; then
              return 0
            fi
            size="$(log_file_size "${path}")"
            if [[ "${path}" == "${saved_path}" ]]; then
              offset="${saved_offset:-0}"
              if (( size < offset )); then
                offset=0
              fi
            else
              offset=0
            fi
            if (( size <= offset )); then
              return 0
            fi
            tail -c "+$((offset + 1))" "${path}" 2>/dev/null || true
          }

          read_fresh_worker_logs() {
            local out_log="$1"
            local err_log="$2"
            local combined=""
            combined+="$(read_appended_log "${out_log}" "${SAVED_OUT_LOG}" "${SAVED_OUT_OFFSET}")"
            combined+=$'\n'
            combined+="$(read_appended_log "${err_log}" "${SAVED_ERR_LOG}" "${SAVED_ERR_OFFSET}")"
            combined+=$'\n'
            printf '%s\n' "${combined}" | filter_worker_log_lines | redact_studio_stream
          }

          fresh_logs_show_env_ready() {
            local logs="$1"
            if [[ "${logs}" != *studio_render_env_ready* ]]; then
              return 1
            fi
            if { [[ "${logs}" == *hasNextPublicSupabaseUrl=true* ]] || [[ "${logs}" == *'"hasNextPublicSupabaseUrl":true'* ]]; } \
              && { [[ "${logs}" == *hasSupabaseServiceRoleKey=true* ]] || [[ "${logs}" == *'"hasSupabaseServiceRoleKey":true'* ]]; }; then
              return 0
            fi
            return 1
          }

          fresh_logs_show_env_missing() {
            local logs="$1"
            [[ "${logs}" == *render_worker_environment_missing* || "${logs}" == *environment_missing* ]]
          }

          poll_fresh_env_ready() {
            local out_log="$1"
            local err_log="$2"
            local waited=0
            local logs=""
            echo "ENV BOOTSTRAP poll: waiting up to ${ENV_BOOTSTRAP_SECONDS}s for FRESH post-offset studio_render_env_ready"
            while (( waited < ENV_BOOTSTRAP_SECONDS )); do
              logs="$(read_fresh_worker_logs "${out_log}" "${err_log}")"
              if fresh_logs_show_env_missing "${logs}"; then
                printf '%s\n' "${logs}"
                echo "ENV BOOTSTRAP FAIL: environment_missing / render_worker_environment_missing in post-offset bytes"
                FRESH_ENV_READY_LOG="NO"
                return 1
              fi
              if fresh_logs_show_env_ready "${logs}"; then
                printf '%s\n' "${logs}"
                echo "ENV BOOTSTRAP: FRESH studio_render_env_ready after ${waited}s"
                FRESH_ENV_READY_LOG="YES"
                return 0
              fi
              sleep "${ENV_BOOTSTRAP_POLL_SECONDS}"
              waited=$((waited + ENV_BOOTSTRAP_POLL_SECONDS))
            done
            logs="$(read_fresh_worker_logs "${out_log}" "${err_log}")"
            printf '%s\n' "${logs}"
            echo "ENV BOOTSTRAP FAIL: no FRESH studio_render_env_ready in post-offset bytes within ${ENV_BOOTSTRAP_SECONDS}s"
            FRESH_ENV_READY_LOG="NO"
            return 1
          }

          wait_until_pm2_online() {
            local deadline=$((SECONDS + ONLINE_TIMEOUT_SECONDS))
            local fields=""
            local status=""
            while (( SECONDS < deadline )); do
              fields="$(read_pm2_recover_fields)"
              status="$(pm2_field "${fields}" "status")"
              if [[ "${status}" == "online" ]]; then
                printf '%s\n' "${fields}"
                return 0
              fi
              sleep "${POLL_SECONDS}"
            done
            fields="$(read_pm2_recover_fields)"
            printf '%s\n' "${fields}"
            return 1
          }

          poll_survival() {
            local start_restarts="$1"
            local start_pid="$2"
            local deadline=$((SECONDS + SURVIVE_SECONDS))
            local fields=""
            local status=""
            local now_restarts=""
            local now_pid=""
            while (( SECONDS < deadline )); do
              fields="$(read_pm2_recover_fields)"
              status="$(pm2_field "${fields}" "status")"
              now_restarts="$(pm2_field "${fields}" "restart_time")"
              now_pid="$(pm2_field "${fields}" "pid")"
              if [[ "${status}" != "online" ]]; then
                printf '%s\n' "${fields}"
                return 1
              fi
              if [[ "${now_restarts}" =~ ^[0-9]+$ && "${start_restarts}" =~ ^[0-9]+$ ]] \
                && (( now_restarts != start_restarts )); then
                printf '%s\n' "${fields}"
                return 1
              fi
              if [[ -n "${start_pid}" && -n "${now_pid}" && "${now_pid}" != "${start_pid}" ]]; then
                printf '%s\n' "${fields}"
                return 1
              fi
              sleep "${POLL_SECONDS}"
            done
            fields="$(read_pm2_recover_fields)"
            printf '%s\n' "${fields}"
            status="$(pm2_field "${fields}" "status")"
            now_restarts="$(pm2_field "${fields}" "restart_time")"
            now_pid="$(pm2_field "${fields}" "pid")"
            if [[ "${status}" != "online" ]]; then
              return 1
            fi
            if [[ "${now_restarts}" =~ ^[0-9]+$ && "${start_restarts}" =~ ^[0-9]+$ ]] \
              && (( now_restarts != start_restarts )); then
              return 1
            fi
            if [[ -n "${start_pid}" && -n "${now_pid}" && "${now_pid}" != "${start_pid}" ]]; then
              return 1
            fi
            return 0
          }

          section "STUDIO_RENDER_WORKER_RECOVER"
          echo "mode=ops_studio_worker_recover"
          echo "audiolad_deploy=NOT_INVOKED"
          echo "CUTOVER=NO"
          echo "ssh_user=$(id -un)"
          echo "workflow_target_sha=${TARGET_SHA}"
          echo "workflow_origin_main_sha=${ORIGIN_MAIN_SHA}"
          unset NEXT_PUBLIC_SUPABASE_URL SUPABASE_SERVICE_ROLE_KEY
          if [[ -n "${NEXT_PUBLIC_SUPABASE_URL:-}" || -n "${SUPABASE_SERVICE_ROLE_KEY:-}" ]]; then
            fail_recover "ssh session still exports worker secrets; refusing start"
            exit 1
          fi

          section "STUDIO_RENDER_WORKER_CURRENT_RELEASE"
          if CURRENT_REAL="$(readlink -f "${CURRENT_LINK}")" && [[ -n "${CURRENT_REAL}" ]]; then
            echo "current_link=${CURRENT_LINK}"
            echo "current_realpath=${CURRENT_REAL}"
            echo "CURRENT RELEASE=$(basename "${CURRENT_REAL}")"
          else
            fail_recover "current release symlink is unreadable"
            exit 1
          fi

          section "STUDIO_RENDER_WORKER_ENV_METADATA"
          if ! ENV_FILE_OWNER_GROUP_MODE="$(stat -c '%U:%G %a' "${SHARED_ENV_PRODUCTION}")"; then
            ENV_FILE_OWNER_GROUP_MODE="STAT_FAILED"
            DEPLOY_CAN_READ_ENV="NO"
            fail_recover "stat failed for shared .env.production"
            exit 1
          fi
          printf 'ENV FILE OWNER/GROUP/MODE = %s\n' "${ENV_FILE_OWNER_GROUP_MODE}"
          if test -r "${SHARED_ENV_PRODUCTION}"; then
            DEPLOY_CAN_READ_ENV="YES"
          else
            DEPLOY_CAN_READ_ENV="NO"
          fi
          printf 'DEPLOY CAN READ ENV = %s\n' "${DEPLOY_CAN_READ_ENV}"
          ENV_PERMISSIONS="${ENV_FILE_OWNER_GROUP_MODE} READ=${DEPLOY_CAN_READ_ENV}"
          printf 'ENV PERMISSIONS = %s\n' "${ENV_PERMISSIONS}"
          if [[ "${DEPLOY_CAN_READ_ENV}" != "YES" ]]; then
            fail_recover "deploy cannot read shared .env.production; refusing restart"
            exit 1
          fi

          section "STUDIO_RENDER_WORKER_ACTIVE_JOBS"
          if ! ACTIVE_RENDER_JOBS_BEFORE="$(count_active_studio_render_jobs)"; then
            ACTIVE_RENDER_JOBS_BEFORE="UNKNOWN"
            fail_recover "could not count queued/processing studio_render_jobs"
            exit 1
          fi
          printf 'ACTIVE RENDER JOBS BEFORE=%s\n' "${ACTIVE_RENDER_JOBS_BEFORE}"
          if [[ "${ACTIVE_RENDER_JOBS_BEFORE}" != "0" ]]; then
            fail_recover "active render jobs != 0; refusing restart"
            exit 1
          fi

          ECOSYSTEM="${CURRENT_LINK}/${ECOSYSTEM_REL}"
          section "STUDIO_RENDER_WORKER_ECOSYSTEM"
          echo "ecosystem=${ECOSYSTEM}"
          if [[ ! -f "${ECOSYSTEM}" ]]; then
            fail_recover "ecosystem file missing; expected deploy/studio-render-worker.ecosystem.config.cjs under current release"
            exit 1
          fi

          section "STUDIO_RENDER_WORKER_CLEAN_START"
          PM2_FIELDS="$(read_pm2_recover_fields)"
          save_log_offsets "${PM2_FIELDS}"
          pm2 delete audiolad-studio-render-worker || true
          unset NEXT_PUBLIC_SUPABASE_URL SUPABASE_SERVICE_ROLE_KEY
          (
            unset NEXT_PUBLIC_SUPABASE_URL SUPABASE_SERVICE_ROLE_KEY
            cd "${CURRENT_LINK}"
            pm2 start deploy/studio-render-worker.ecosystem.config.cjs
          )
          PM2_FIELDS="$(read_pm2_recover_fields)"
          PM2_STATUS="$(pm2_field "${PM2_FIELDS}" "status")"
          if [[ "${PM2_STATUS}" == "missing" || -z "${PM2_STATUS}" ]]; then
            fail_recover "pm2 did not register audiolad-studio-render-worker after start"
            exit 1
          fi
          WORKER_CLEAN_START="YES"
          echo "WORKER CLEAN START = YES"

          section "STUDIO_RENDER_WORKER_WAIT_ONLINE"
          set +e
          PM2_FIELDS="$(wait_until_pm2_online)"
          set -e
          PM2_STATUS="$(pm2_field "${PM2_FIELDS}" "status")"
          WORKER_RESTARTS="$(pm2_field "${PM2_FIELDS}" "restart_time")"
          WORKER_PID="$(pm2_field "${PM2_FIELDS}" "pid")"
          OUT_LOG="$(pm2_field "${PM2_FIELDS}" "out_log")"
          ERR_LOG="$(pm2_field "${PM2_FIELDS}" "error_log")"
          echo "status=${PM2_STATUS}"
          echo "WORKER PID=${WORKER_PID}"
          echo "WORKER RESTARTS=${WORKER_RESTARTS}"
          if [[ "${PM2_STATUS}" != "online" ]]; then
            fail_recover "worker did not reach PM2 status=online"
            exit 1
          fi

          section "STUDIO_RENDER_WORKER_ENV_BOOTSTRAP"
          echo "out_log_path=${OUT_LOG:-unknown}"
          echo "error_log_path=${ERR_LOG:-unknown}"
          echo "saved_out_offset=${SAVED_OUT_OFFSET}"
          echo "saved_err_offset=${SAVED_ERR_OFFSET}"
          set +e
          poll_fresh_env_ready "${OUT_LOG}" "${ERR_LOG}"
          set -e
          echo "FRESH ENV READY LOG = ${FRESH_ENV_READY_LOG}"
          if [[ "${FRESH_ENV_READY_LOG}" != "YES" ]]; then
            fail_recover "no FRESH post-offset studio_render_env_ready with both env booleans true"
            exit 1
          fi

          PM2_FIELDS="$(read_pm2_recover_fields)"
          PM2_STATUS="$(pm2_field "${PM2_FIELDS}" "status")"
          WORKER_RESTARTS="$(pm2_field "${PM2_FIELDS}" "restart_time")"
          WORKER_PID="$(pm2_field "${PM2_FIELDS}" "pid")"
          echo "status=${PM2_STATUS}"
          echo "WORKER PID=${WORKER_PID}"
          echo "WORKER RESTARTS=${WORKER_RESTARTS}"
          if [[ "${PM2_STATUS}" != "online" ]]; then
            fail_recover "worker left PM2 status=online before survival window"
            exit 1
          fi

          section "STUDIO_RENDER_WORKER_SURVIVAL"
          START_RESTARTS="${WORKER_RESTARTS}"
          START_PID="${WORKER_PID}"
          set +e
          PM2_FIELDS="$(poll_survival "${START_RESTARTS}" "${START_PID}")"
          set -e
          PM2_STATUS="$(pm2_field "${PM2_FIELDS}" "status")"
          END_RESTARTS="$(pm2_field "${PM2_FIELDS}" "restart_time")"
          END_PID="$(pm2_field "${PM2_FIELDS}" "pid")"
          WORKER_RESTARTS="${END_RESTARTS}"
          WORKER_PID="${END_PID}"
          echo "status=${PM2_STATUS}"
          echo "WORKER PID=${WORKER_PID}"
          echo "WORKER RESTARTS=${WORKER_RESTARTS}"
          if [[ "${END_RESTARTS}" =~ ^[0-9]+$ && "${START_RESTARTS}" =~ ^[0-9]+$ ]] \
            && (( END_RESTARTS == START_RESTARTS )); then
            RESTART_COUNT_STABLE="YES"
          else
            RESTART_COUNT_STABLE="NO"
          fi
          echo "RESTART COUNT STABLE = ${RESTART_COUNT_STABLE}"
          if [[ "${PM2_STATUS}" == "online" ]] \
            && [[ "${RESTART_COUNT_STABLE}" == "YES" ]] \
            && [[ -n "${START_PID}" && "${END_PID}" == "${START_PID}" ]]; then
            SURVIVED_OVER_2_5_MIN="YES"
          else
            SURVIVED_OVER_2_5_MIN="NO"
            fail_recover "worker did not survive ${SURVIVE_SECONDS}s with stable pid/status/restart count"
            exit 1
          fi
          echo "SURVIVED >2.5 MIN = YES"

          section "STUDIO_RENDER_WORKER_SMOKE"
          set +e
          RENDER_SMOKE="$(run_safe_render_smoke)"
          set -e
          if [[ "${RENDER_SMOKE}" != "PASS" ]]; then
            RENDER_SMOKE="FAIL"
          fi
          echo "RENDER SMOKE = ${RENDER_SMOKE}"
          if [[ "${RENDER_SMOKE}" != "PASS" ]]; then
            fail_recover "safe render smoke did not PASS"
            exit 1
          fi

          if [[ "${WORKER_CLEAN_START}" == "YES" && "${FRESH_ENV_READY_LOG}" == "YES" && "${RESTART_COUNT_STABLE}" == "YES" && "${SURVIVED_OVER_2_5_MIN}" == "YES" && "${RENDER_SMOKE}" == "PASS" ]]; then
            ACCEPTANCE="SUCCESS"
            pm2 save
          fi

          section "STUDIO_RENDER_WORKER_RECOVER_END"
          print_final_flags
          if [[ "${ACCEPTANCE}" != "SUCCESS" ]]; then
            exit 1
          fi
          REMOTE_RECOVER

      - name: Remove SSH identity
        if: always()
        run: |
          set -euo pipefail
          if [[ -n "${SSH_DIR:-}" ]]; then
            rm -rf "${SSH_DIR}"
          fi

  disk_storage_audit:
    name: Ops disk/Storage audit
    needs: resolve
    if: inputs.confirm == 'OPS_DISK_STORAGE_AUDIT'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Prepare SSH identity
        env:
          PRODUCTION_SSH_PRIVATE_KEY: ${{ secrets.PRODUCTION_SSH_PRIVATE_KEY }}
          PRODUCTION_SSH_KNOWN_HOSTS: ${{ secrets.PRODUCTION_SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          set +x
          : "${PRODUCTION_SSH_PRIVATE_KEY:?PRODUCTION_SSH_PRIVATE_KEY secret is required}"
          : "${PRODUCTION_SSH_KNOWN_HOSTS:?PRODUCTION_SSH_KNOWN_HOSTS secret is required}"
          umask 077
          SSH_DIR="$(mktemp -d)"
          KEY_FILE="${SSH_DIR}/id"
          HOSTS_FILE="${SSH_DIR}/known_hosts"
          printf '%s\n' "${PRODUCTION_SSH_PRIVATE_KEY}" > "${KEY_FILE}"
          printf '%s\n' "${PRODUCTION_SSH_KNOWN_HOSTS}" > "${HOSTS_FILE}"
          chmod 0600 "${KEY_FILE}" "${HOSTS_FILE}"
          echo "SSH_DIR=${SSH_DIR}" >> "${GITHUB_ENV}"
          echo "SSH_KEY_FILE=${KEY_FILE}" >> "${GITHUB_ENV}"
          echo "SSH_KNOWN_HOSTS_FILE=${HOSTS_FILE}" >> "${GITHUB_ENV}"

      - name: Read-only disk/Storage audit via SSH
        env:
          PRODUCTION_SSH_HOST: ${{ secrets.PRODUCTION_SSH_HOST }}
          PRODUCTION_SSH_PORT: ${{ secrets.PRODUCTION_SSH_PORT }}
          PRODUCTION_SSH_USER: ${{ secrets.PRODUCTION_SSH_USER }}
          TARGET_SHA: ${{ needs.resolve.outputs.target_sha }}
          ORIGIN_MAIN_SHA: ${{ needs.resolve.outputs.origin_main_sha }}
        run: |
          set -euo pipefail
          : "${PRODUCTION_SSH_HOST:?PRODUCTION_SSH_HOST secret is required}"
          : "${PRODUCTION_SSH_PORT:?PRODUCTION_SSH_PORT secret is required}"
          : "${PRODUCTION_SSH_USER:?PRODUCTION_SSH_USER secret is required}"

          ssh \
            -i "${SSH_KEY_FILE}" \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o UserKnownHostsFile="${SSH_KNOWN_HOSTS_FILE}" \
            -o StrictHostKeyChecking=yes \
            -p "${PRODUCTION_SSH_PORT}" \
            -- \
            "${PRODUCTION_SSH_USER}@${PRODUCTION_SSH_HOST}" \
            "bash -s" "${TARGET_SHA}" "${ORIGIN_MAIN_SHA}" <<'REMOTE_DISK_AUDIT'
          set -euo pipefail
          TARGET_SHA="$1"
          ORIGIN_MAIN_SHA="$2"
          shift 2

          # Hardcoded ops-only disk/Storage audit. Never invoke audiolad-deploy.
          # Operator/local equivalent:
          #   bash deploy/scripts/audiolad-disk-storage-audit.sh
          # Read-only production disk/Storage cleanup AUDIT for operators / GHA
          # confirm=OPS_DISK_STORAGE_AUDIT. Never deletes production paths, never
          # invokes audiolad-deploy / deploy.sh, never does nginx or current/previous
          # symlink cutover, never prints env file contents or secret values.
          # Docker exec to supabase-db may fail for deploy — fall back to node
          # loadEnvConfig + supabase-js, same as recover. Do not load .env.production
          # in this shell.
          
          DEPLOY_ROOT="${DEPLOY_ROOT:-/var/www/audiolad-deploy}"
          CURRENT_LINK="${DEPLOY_ROOT}/current"
          PREVIOUS_LINK="${DEPLOY_ROOT}/previous"
          RELEASES_DIR="${DEPLOY_ROOT}/releases"
          SHARED_ENV_PRODUCTION="${DEPLOY_ROOT}/shared/.env.production"
          DB_CONTAINER="${AUDIOLAD_SUPABASE_DB_CONTAINER:-supabase-db}"
          AUDIT_TMP_DIR="${AUDIT_TMP_DIR:-/tmp}"
          AUDIT_LOG_DIR="${AUDIT_LOG_DIR:-/var/log}"
          AUDIT_NGINX_LOG_DIR="${AUDIT_NGINX_LOG_DIR:-/var/log/nginx}"
          AUDIT_PM2_LOG_DIR="${AUDIT_PM2_LOG_DIR:-/home/deploy/.pm2/logs}"
          AUDIT_DOCKER_VOLUMES_DIR="${AUDIT_DOCKER_VOLUMES_DIR:-/var/lib/docker/volumes}"
          
          CUTOVER="NO"
          AUDIOLAD_DEPLOY="NOT_INVOKED"
          MODE="read_only_audit"
          SAFE_DELETE_BYTES=0
          SAFE_DELETE_LINES=()
          NEEDS_REVIEW_LINES=()
          TEST_ORPHAN_LINES=()
          OLD_RELEASE_LINES=()
          DISK_BEFORE_TEXT=""
          LARGEST_DIRS_TEXT=""
          LOG_SIZES_TEXT=""
          
          if ! declare -F redact_stream >/dev/null 2>&1; then
            redact_stream() {
              sed -E \
                -e 's/(GETCOURSE_API_KEY=).*/\1***/g' \
                -e 's/(GETCOURSE_CALLBACK_SECRET=).*/\1***/g' \
                -e 's/(SUPABASE_SERVICE_ROLE_KEY=).*/\1***/g' \
                -e 's/[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\.[A-Za-z]{2,}/[redacted-email]/g'
            }
          fi
          
          redact_studio_stream() {
            redact_stream | sed -E \
              -e 's#https?://[^[:space:]\"'\'']+#[redacted-url]#g' \
              -e 's/eyJ[A-Za-z0-9_-]+\.[A-Za-z0-9_-]+\.[A-Za-z0-9_-]+/[redacted-jwt]/g'
          }
          
          if ! declare -F section >/dev/null 2>&1; then
            section() {
              printf '\n===== %s =====\n' "$1"
            }
          fi
          
          human_bytes() {
            local bytes="${1:-0}"
            if ! [[ "${bytes}" =~ ^[0-9]+$ ]]; then
              printf '%s\n' "0"
              return 0
            fi
            awk -v b="${bytes}" 'BEGIN {
              if (b < 1024) { printf "%sB\n", b; exit }
              split("K M G T", u)
              n = b
              i = 0
              while (n >= 1024 && i < 4) { n = n / 1024; i++ }
              if (n >= 10) printf "%.0f%s\n", n, u[i]
              else printf "%.1f%s\n", n, u[i]
            }'
          }
          
          path_bytes() {
            local path="$1"
            if [[ -z "${path}" || ! -e "${path}" ]]; then
              printf '%s\n' "0"
              return 0
            fi
            du -sb --apparent-size "${path}" 2>/dev/null | awk '{print $1; exit}' || printf '%s\n' "0"
          }
          
          add_safe_delete() {
            local bytes="$1"
            local line="$2"
            if ! [[ "${bytes}" =~ ^[0-9]+$ ]]; then
              bytes=0
            fi
            SAFE_DELETE_BYTES=$((SAFE_DELETE_BYTES + bytes))
            SAFE_DELETE_LINES+=("${line}")
          }
          
          add_needs_review() {
            NEEDS_REVIEW_LINES+=("$1")
          }
          
          add_test_orphan() {
            TEST_ORPHAN_LINES+=("$1")
          }
          
          print_list_or_none() {
            local -n lines=$1
            if ((${#lines[@]} == 0)); then
              echo "(none)"
              return 0
            fi
            local line=""
            for line in "${lines[@]}"; do
              printf '%s\n' "${line}"
            done
          }
          
          try_cmd() {
            local label="$1"
            shift
            section "${label}"
            set +e
            "$@" 2>&1 | redact_studio_stream
            local code=$?
            set -e
            if [[ "${code}" -ne 0 ]]; then
              printf 'BLOCKED exit=%s label=%s\n' "${code}" "${label}"
            fi
            return 0
          }
          
          docker_bin() {
            if [[ -n "${AUDIOLAD_DOCKER_BIN:-}" ]]; then
              printf '%s\n' "${AUDIOLAD_DOCKER_BIN}"
              return 0
            fi
            if command -v docker >/dev/null 2>&1; then
              printf '%s\n' "docker"
              return 0
            fi
            return 1
          }
          
          is_proven_test_blob() {
            local blob
            blob="$(printf '%s' "$*" | tr '[:upper:]' '[:lower:]')"
            [[ "${blob}" == *6aa9fd82* ]] && return 0
            [[ "${blob}" == *synth_3h* ]] && return 0
            [[ "${blob}" == *synth_3h_le10800* ]] && return 0
            if [[ "${blob}" == *75-min* || "${blob}" == *75min* || "${blob}" == *75_min* ]]; then
              return 0
            fi
            return 1
          }
          
          audit_disk_before() {
            local mounts=""
            local out=""
            section "DISK BEFORE"
            echo "DISK BEFORE ="
            set +e
            out="$(df -h / ${DEPLOY_ROOT} /var/www "${AUDIT_TMP_DIR}" "${AUDIT_LOG_DIR}" 2>/dev/null)"
            set -e
            if [[ -n "${out}" ]]; then
              printf '%s\n' "${out}" | redact_studio_stream
              DISK_BEFORE_TEXT="${out}"
            else
              echo "df_unreadable"
              DISK_BEFORE_TEXT="df_unreadable"
            fi
            set +e
            mounts="$(findmnt -rno TARGET,FSTYPE,SIZE,USED,AVAIL,USE% / /var/www "${DEPLOY_ROOT}" 2>/dev/null)"
            set -e
            if [[ -n "${mounts}" ]]; then
              echo "findmnt<<"
              printf '%s\n' "${mounts}"
              echo ">>findmnt"
            fi
            set +e
            if docker_bin >/dev/null; then
              echo "docker_system_df<<"
              "$(docker_bin)" system df 2>&1 | redact_studio_stream
              echo ">>docker_system_df"
              echo "docker_volume_ls<<"
              "$(docker_bin)" volume ls 2>&1 | redact_studio_stream
              echo ">>docker_volume_ls"
            else
              echo "docker_unreadable_or_missing"
            fi
            set -e
            if [[ -d "${AUDIT_DOCKER_VOLUMES_DIR}" ]]; then
              if [[ -r "${AUDIT_DOCKER_VOLUMES_DIR}" ]]; then
                echo "docker_volumes_dir=${AUDIT_DOCKER_VOLUMES_DIR}"
                du -xh --max-depth=1 "${AUDIT_DOCKER_VOLUMES_DIR}" 2>/dev/null | sort -h | tail -n 20 || echo "docker_volumes_du_blocked"
              else
                echo "docker_volumes_dir_unreadable path=${AUDIT_DOCKER_VOLUMES_DIR}"
              fi
            fi
          }
          
          audit_largest_directories() {
            local path=""
            local out=""
            section "LARGEST DIRECTORIES"
            echo "LARGEST DIRECTORIES ="
            LARGEST_DIRS_TEXT=""
            for path in \
              "${DEPLOY_ROOT}" \
              "${AUDIT_TMP_DIR}" \
              "${AUDIT_LOG_DIR}" \
              "${AUDIT_PM2_LOG_DIR}" \
              "${AUDIT_TMP_DIR}"/audiolad-studio-* \
              "${AUDIT_TMP_DIR}"/audiolad-studio-*.wav \
              "${AUDIT_TMP_DIR}"/audiolad-studio-*.mp3 \
              "${AUDIT_TMP_DIR}"/audiolad-studio-*.webm
            do
              if [[ "${path}" == *'*'* ]]; then
                continue
              fi
              if [[ ! -e "${path}" ]]; then
                echo "missing path=${path}"
                continue
              fi
              if [[ ! -r "${path}" ]]; then
                echo "unreadable path=${path}"
                continue
              fi
              echo "du path=${path}"
              set +e
              out="$(du -xh --max-depth=2 "${path}" 2>/dev/null | sort -h | tail -n 40)"
              set -e
              if [[ -n "${out}" ]]; then
                printf '%s\n' "${out}"
                LARGEST_DIRS_TEXT+="${out}"$'\n'
              else
                echo "du_blocked path=${path}"
              fi
            done
            echo "studio_ffmpeg_temp_globs<<"
            set +e
            ls -ld "${AUDIT_TMP_DIR}"/audiolad-studio-* 2>/dev/null | redact_studio_stream
            set -e
            echo ">>studio_ffmpeg_temp_globs"
          }
          
          audit_log_sizes() {
            local path=""
            section "LOG SIZES"
            LOG_SIZES_TEXT=""
            for path in \
              "${AUDIT_PM2_LOG_DIR}" \
              "${AUDIT_NGINX_LOG_DIR}" \
              "${AUDIT_LOG_DIR}/nginx" \
              "${AUDIT_LOG_DIR}/audiolad" \
              "${AUDIT_LOG_DIR}/journal"
            do
              if [[ ! -e "${path}" ]]; then
                echo "missing path=${path}"
                continue
              fi
              if [[ ! -r "${path}" ]]; then
                echo "unreadable path=${path}"
                continue
              fi
              echo "log_path=${path} size=$(du -sh "${path}" 2>/dev/null | awk '{print $1}')"
              set +e
              du -xh --max-depth=1 "${path}" 2>/dev/null | sort -h | tail -n 20
              set -e
            done
            if command -v journalctl >/dev/null 2>&1; then
              set +e
              journalctl --disk-usage 2>&1 | redact_studio_stream
              set -e
            fi
          }
          
          audit_old_releases() {
            local current_real=""
            local previous_real=""
            local entry=""
            local real=""
            local name=""
            local size=""
            local bytes=""
            local mtime=""
            local mark=""
            section "OLD RELEASES FOUND"
            echo "OLD RELEASES FOUND ="
            if current_real="$(readlink -f "${CURRENT_LINK}" 2>/dev/null)" && [[ -n "${current_real}" ]]; then
              echo "CURRENT=$(basename "${current_real}") path=${current_real}"
            else
              current_real=""
              echo "CURRENT=UNKNOWN current_link_unreadable"
            fi
            if previous_real="$(readlink -f "${PREVIOUS_LINK}" 2>/dev/null)" && [[ -n "${previous_real}" ]]; then
              echo "PREVIOUS=$(basename "${previous_real}") path=${previous_real}"
            else
              previous_real=""
              echo "PREVIOUS=UNKNOWN previous_link_unreadable"
            fi
            echo "recommend_keep=current+previous_rollback"
            if [[ ! -d "${RELEASES_DIR}" ]]; then
              echo "releases_dir_missing path=${RELEASES_DIR}"
              return 0
            fi
            if [[ ! -r "${RELEASES_DIR}" ]]; then
              echo "releases_dir_unreadable path=${RELEASES_DIR}"
              return 0
            fi
            shopt -s nullglob
            for entry in "${RELEASES_DIR}"/*; do
              name="$(basename "${entry}")"
              real="$(readlink -f "${entry}" 2>/dev/null || printf '%s' "${entry}")"
              bytes="$(path_bytes "${entry}")"
              size="$(human_bytes "${bytes}")"
              mtime="$(stat -c '%y' "${entry}" 2>/dev/null || echo unknown)"
              mark="CANDIDATE"
              if [[ -n "${current_real}" && "${real}" == "${current_real}" ]]; then
                mark="CURRENT"
              elif [[ -n "${previous_real}" && "${real}" == "${previous_real}" ]]; then
                mark="PREVIOUS"
              fi
              OLD_RELEASE_LINES+=("release=${name} mark=${mark} size=${size} bytes=${bytes} mtime=${mtime} path=${entry}")
              printf '%s\n' "${OLD_RELEASE_LINES[-1]}"
              if [[ "${mark}" == "CANDIDATE" ]]; then
                add_safe_delete "${bytes}" "SAFE_TO_DELETE kind=release reason=older_than_current_and_previous size=${size} path=${entry}"
              fi
            done
            shopt -u nullglob
          }
          
          safe_find_test_names() {
            local root="$1"
            if [[ ! -d "${root}" || ! -r "${root}" ]]; then
              return 0
            fi
            set +e
            find "${root}" -xdev \
              \( -name node_modules -o -name .git -o -name '.next' \) -prune -o \
              -regextype posix-extended \
              \( -iname '*6aa9fd82*' -o -iname '*synth_3h*' -o -iname '*synth_3h_le10800*' \
                 -o -iname '*10802*' -o -iname '*75-min*' -o -iname '*75min*' \
                 -o -iname '*75_min*' \) \
              -print 2>/dev/null
            set -e
            return 0
          }
          
          audit_disk_test_orphans() {
            local root=""
            local found=""
            local path=""
            local bytes=""
            local size=""
            local blob=""
            section "TEST/ORPHAN FILES FOUND"
            echo "TEST/ORPHAN FILES FOUND ="
            for root in "${DEPLOY_ROOT}" "${AUDIT_TMP_DIR}" "${AUDIT_LOG_DIR}" "${AUDIT_PM2_LOG_DIR}"; do
              found="$(safe_find_test_names "${root}")"
              if [[ -z "${found}" ]]; then
                continue
              fi
              while IFS= read -r path; do
                [[ -n "${path}" ]] || continue
                bytes="$(path_bytes "${path}")"
                size="$(human_bytes "${bytes}")"
                blob="${path}"
                add_test_orphan "disk path=${path} size=${size} bytes=${bytes}"
                if is_proven_test_blob "${blob}"; then
                  add_safe_delete "${bytes}" "SAFE_TO_DELETE kind=disk_test_fixture reason=proven_acceptance_name size=${size} path=${path}"
                else
                  add_needs_review "NEEDS_REVIEW kind=disk_possible_fixture size=${size} path=${path}"
                fi
              done <<< "${found}"
            done
            shopt -s nullglob
            for path in "${AUDIT_TMP_DIR}"/audiolad-studio-*; do
              [[ -e "${path}" ]] || continue
              bytes="$(path_bytes "${path}")"
              size="$(human_bytes "${bytes}")"
              add_test_orphan "ffmpeg_temp path=${path} size=${size} bytes=${bytes}"
              if is_proven_test_blob "${path}"; then
                add_safe_delete "${bytes}" "SAFE_TO_DELETE kind=ffmpeg_temp reason=proven_acceptance_name size=${size} path=${path}"
              else
                add_needs_review "NEEDS_REVIEW kind=ffmpeg_temp_leftover size=${size} path=${path}"
              fi
            done
            shopt -u nullglob
          }
          
          run_db_storage_probe_docker() {
            local bin=""
            local raw=""
            local code=0
            if ! bin="$(docker_bin)"; then
              return 1
            fi
            set +e
            raw="$(
              "${bin}" exec "${DB_CONTAINER}" \
                psql -U postgres -d postgres -tA -F $'\t' -c \
                "SELECT 'project', id::text, coalesce(status,''), coalesce(deleted_at::text,''),
                        CASE WHEN author_id IS NULL THEN 'NO' ELSE 'YES' END,
                        coalesce(name,''), ''
                   FROM public.studio_projects
                  WHERE id::text LIKE '6aa9fd82%'
                     OR name ILIKE '%synth_3h%'
                     OR name ILIKE '%synth_3h_le10800%'
                     OR name ILIKE '%10802%'
                     OR name ILIKE '%75-min%'
                     OR name ILIKE '%75min%';
                 SELECT 'asset', id::text, project_id::text, coalesce(deleted_at::text,''),
                        coalesce(storage_path,''), coalesce(original_name,''),
                        coalesce(size_bytes::text,'0') || '|' || coalesce(duration_seconds::text,'')
                   FROM public.studio_project_assets
                  WHERE project_id::text LIKE '6aa9fd82%'
                     OR storage_path ILIKE '%6aa9fd82%'
                     OR storage_path ILIKE '%synth_3h%'
                     OR original_name ILIKE '%synth_3h%'
                     OR original_name ILIKE '%10802%'
                     OR original_name ILIKE '%75-min%'
                     OR original_name ILIKE '%75min%'
                     OR duration_seconds BETWEEN 10700 AND 10900
                     OR duration_seconds BETWEEN 4470 AND 4530
                     OR size_bytes BETWEEN 330000000 AND 370000000;
                 SELECT 'job', id::text, project_id::text, coalesce(status,''),
                        coalesce(output_storage_path,''), '', ''
                   FROM public.studio_render_jobs
                  WHERE project_id::text LIKE '6aa9fd82%'
                     OR coalesce(output_storage_path,'') ILIKE '%6aa9fd82%'
                     OR coalesce(output_storage_path,'') ILIKE '%synth_3h%';
                 SELECT 'storage', bucket_id, name, coalesce(metadata->>'size',''),
                        '', '', ''
                   FROM storage.objects
                  WHERE bucket_id IN ('studio-draft-assets','studio-renders')
                    AND (name ILIKE '%6aa9fd82%'
                         OR name ILIKE '%synth_3h%'
                         OR name ILIKE '%synth_3h_le10800%'
                         OR name ILIKE '%10802%'
                         OR name ILIKE '%75-min%'
                         OR name ILIKE '%75min%');"
            )"
            code=$?
            set -e
            if [[ "${code}" -ne 0 || -z "${raw}" ]]; then
              return 1
            fi
            printf '%s\n' "${raw}" | redact_studio_stream
            return 0
          }
          
          run_db_storage_probe_node() {
            local dir="${CURRENT_LINK}"
            local probe=""
            local output=""
            local code=0
            if [[ ! -d "${dir}" ]]; then
              return 1
            fi
            probe="$(mktemp)"
            cat >"${probe}" <<'JS'
          const silent = { info() {}, error() {} };
          const dir = process.argv[2];
          delete process.env.NEXT_PUBLIC_SUPABASE_URL;
          delete process.env.SUPABASE_SERVICE_ROLE_KEY;
          const { loadEnvConfig } = require("@next/env");
          loadEnvConfig(dir, false, silent, true);
          const url = process.env.NEXT_PUBLIC_SUPABASE_URL;
          const key = process.env.SUPABASE_SERVICE_ROLE_KEY;
          delete process.env.NEXT_PUBLIC_SUPABASE_URL;
          delete process.env.SUPABASE_SERVICE_ROLE_KEY;
          if (!url || !key) {
            console.log("DB_PROBE=UNAVAILABLE reason=missing_env");
            process.exit(2);
          }
          const { createClient } = require("@supabase/supabase-js");
          const service = createClient(url, key, {
            auth: { autoRefreshToken: false, persistSession: false },
          });
          const timer = setTimeout(() => {
            console.log("DB_PROBE=UNAVAILABLE reason=timeout");
            process.exit(2);
          }, 25000);
          
          function provenTest(parts) {
            const blob = parts.filter(Boolean).join(" ").toLowerCase();
            return (
              blob.includes("6aa9fd82") ||
              blob.includes("synth_3h") ||
              blob.includes("10802") ||
              /\b75[-_ ]?min/.test(blob)
            );
          }
          
          function emit(kind, fields) {
            const pairs = Object.entries(fields).map(([k, v]) => {
              const value = v == null ? "" : String(v).replace(/\s+/g, " ").slice(0, 240);
              return k + "=" + value;
            });
            console.log(["HIT", "kind=" + kind].concat(pairs).join(" "));
          }
          
          Promise.resolve()
            .then(async () => {
              const projectQueries = [
                service.from("studio_projects").select("id,status,deleted_at,author_id,name").ilike("name", "%synth_3h%"),
                service.from("studio_projects").select("id,status,deleted_at,author_id,name").ilike("name", "%10802%"),
                service.from("studio_projects").select("id,status,deleted_at,author_id,name").ilike("name", "%75-min%"),
                service.from("studio_projects").select("id,status,deleted_at,author_id,name").ilike("id", "6aa9fd82%"),
              ];
              const assetQueries = [
                service.from("studio_project_assets").select("id,project_id,storage_path,original_name,size_bytes,duration_seconds,deleted_at").ilike("storage_path", "%6aa9fd82%"),
                service.from("studio_project_assets").select("id,project_id,storage_path,original_name,size_bytes,duration_seconds,deleted_at").ilike("storage_path", "%synth_3h%"),
                service.from("studio_project_assets").select("id,project_id,storage_path,original_name,size_bytes,duration_seconds,deleted_at").ilike("original_name", "%synth_3h%"),
                service.from("studio_project_assets").select("id,project_id,storage_path,original_name,size_bytes,duration_seconds,deleted_at").ilike("original_name", "%75-min%"),
                service.from("studio_project_assets").select("id,project_id,storage_path,original_name,size_bytes,duration_seconds,deleted_at").gte("duration_seconds", 10700).lte("duration_seconds", 10900),
                service.from("studio_project_assets").select("id,project_id,storage_path,original_name,size_bytes,duration_seconds,deleted_at").gte("duration_seconds", 4470).lte("duration_seconds", 4530),
                service.from("studio_project_assets").select("id,project_id,storage_path,original_name,size_bytes,duration_seconds,deleted_at").gte("size_bytes", 330000000).lte("size_bytes", 370000000),
              ];
              const jobQueries = [
                service.from("studio_render_jobs").select("id,project_id,status,output_storage_path").ilike("output_storage_path", "%6aa9fd82%"),
                service.from("studio_render_jobs").select("id,project_id,status,output_storage_path").ilike("output_storage_path", "%synth_3h%"),
              ];
              const seen = new Set();
              for (const result of await Promise.allSettled([...projectQueries, ...assetQueries, ...jobQueries])) {
                if (result.status !== "fulfilled" || result.value.error || !Array.isArray(result.value.data)) continue;
                for (const row of result.value.data) {
                  const kind = row.storage_path != null || row.original_name != null ? "asset" : row.output_storage_path != null || (row.status != null && row.project_id != null && row.name == null) ? "job" : "project";
                  const key = kind + ":" + (row.id || "") + ":" + (row.storage_path || row.output_storage_path || row.name || "");
                  if (seen.has(key)) continue;
                  seen.add(key);
                  const proven = provenTest([
                    row.id,
                    row.project_id,
                    row.name,
                    row.storage_path,
                    row.original_name,
                    row.output_storage_path,
                  ]);
                  const deleted = Boolean(row.deleted_at) || row.status === "deleted";
                  const hasAuthor = Boolean(row.author_id);
                  emit(kind, {
                    id: row.id,
                    project_id: row.project_id || "",
                    status: row.status || "",
                    deleted: deleted ? "YES" : "NO",
                    has_author: hasAuthor ? "YES" : "NO",
                    name: row.name || "",
                    path: row.storage_path || row.output_storage_path || "",
                    original_name: row.original_name || "",
                    size_bytes: row.size_bytes || "",
                    duration_seconds: row.duration_seconds || "",
                    proven_test: proven ? "YES" : "NO",
                  });
                }
              }
              const buckets = ["studio-draft-assets", "studio-renders"];
              const needles = ["6aa9fd82", "synth_3h", "synth_3h_le10800", "10802", "75-min", "75min"];
              const prefixes = ["", "studio", "studio/guest"];
              for (const bucket of buckets) {
                for (const prefix of prefixes) {
                  for (const needle of needles) {
                    try {
                      const listed = await service.storage.from(bucket).list(prefix, { limit: 100, search: needle });
                      if (listed.error || !Array.isArray(listed.data)) continue;
                      for (const obj of listed.data) {
                        const name = [prefix, obj.name].filter(Boolean).join("/");
                        const size = obj.metadata && obj.metadata.size != null ? obj.metadata.size : obj.size || "";
                        const proven = provenTest([name, obj.name]);
                        const key = "storage:" + bucket + ":" + name;
                        if (seen.has(key)) continue;
                        seen.add(key);
                        emit("storage", {
                          bucket,
                          path: name,
                          size_bytes: size,
                          proven_test: proven ? "YES" : "NO",
                        });
                      }
                    } catch {
                      // listing may fail for deploy; keep going
                    }
                  }
                }
              }
              console.log("DB_PROBE=OK");
              clearTimeout(timer);
            })
            .catch(() => {
              clearTimeout(timer);
              console.log("DB_PROBE=UNAVAILABLE reason=error");
              process.exit(2);
            });
          JS
            set +e
            output="$(
              unset NEXT_PUBLIC_SUPABASE_URL SUPABASE_SERVICE_ROLE_KEY
              export NODE_ENV=production
              export NODE_PATH="${dir}/node_modules${NODE_PATH:+:${NODE_PATH}}"
              cd "${dir}"
              node "${probe}" "${dir}" 2>/dev/null
            )"
            code=$?
            set -e
            rm -f "${probe}"
            output="$(printf '%s\n' "${output}" | redact_studio_stream)"
            if [[ "${code}" -ne 0 && "${output}" != *DB_PROBE=OK* ]]; then
              return 1
            fi
            printf '%s\n' "${output}"
            return 0
          }
          
          classify_probe_hits() {
            local line=""
            local kind=""
            local proven=""
            local deleted=""
            local has_author=""
            local path=""
            local size_bytes=""
            local id=""
            local status=""
            local name=""
            local original_name=""
            local blob=""
            while IFS= read -r line; do
              [[ -n "${line}" ]] || continue
              case "${line}" in
                HIT\ *)
                  kind="$(printf '%s\n' "${line}" | awk '{for(i=1;i<=NF;i++) if($i ~ /^kind=/) {sub(/^kind=/,"",$i); print $i; exit}}')"
                  proven="$(printf '%s\n' "${line}" | awk '{for(i=1;i<=NF;i++) if($i ~ /^proven_test=/) {sub(/^proven_test=/,"",$i); print $i; exit}}')"
                  deleted="$(printf '%s\n' "${line}" | awk '{for(i=1;i<=NF;i++) if($i ~ /^deleted=/) {sub(/^deleted=/,"",$i); print $i; exit}}')"
                  has_author="$(printf '%s\n' "${line}" | awk '{for(i=1;i<=NF;i++) if($i ~ /^has_author=/) {sub(/^has_author=/,"",$i); print $i; exit}}')"
                  path="$(printf '%s\n' "${line}" | awk '{for(i=1;i<=NF;i++) if($i ~ /^path=/) {sub(/^path=/,"",$i); print $i; exit}}')"
                  size_bytes="$(printf '%s\n' "${line}" | awk '{for(i=1;i<=NF;i++) if($i ~ /^size_bytes=/) {sub(/^size_bytes=/,"",$i); print $i; exit}}')"
                  id="$(printf '%s\n' "${line}" | awk '{for(i=1;i<=NF;i++) if($i ~ /^id=/) {sub(/^id=/,"",$i); print $i; exit}}')"
                  status="$(printf '%s\n' "${line}" | awk '{for(i=1;i<=NF;i++) if($i ~ /^status=/) {sub(/^status=/,"",$i); print $i; exit}}')"
                  name="$(printf '%s\n' "${line}" | awk '{for(i=1;i<=NF;i++) if($i ~ /^name=/) {sub(/^name=/,"",$i); print $i; exit}}')"
                  original_name="$(printf '%s\n' "${line}" | awk '{for(i=1;i<=NF;i++) if($i ~ /^original_name=/) {sub(/^original_name=/,"",$i); print $i; exit}}')"
                  blob="${id} ${path} ${name} ${original_name}"
                  if [[ "${proven}" != "YES" ]] && is_proven_test_blob "${blob}"; then
                    proven="YES"
                  fi
                  add_test_orphan "db_or_storage ${line}"
                  if [[ "${has_author}" == "YES" && "${deleted}" != "YES" && "${status}" != "deleted" && "${proven}" != "YES" ]]; then
                    add_needs_review "NEEDS_REVIEW kind=${kind} reason=possible_real_user_active id=${id} path=${path}"
                    continue
                  fi
                  if [[ "${proven}" == "YES" && ( "${deleted}" == "YES" || "${status}" == "deleted" || -z "${status}" ) ]]; then
                    add_safe_delete "${size_bytes:-0}" "SAFE_TO_DELETE kind=${kind} reason=proven_test_and_no_active_or_deleted id=${id} path=${path} size=$(human_bytes "${size_bytes:-0}")"
                    continue
                  fi
                  if [[ "${proven}" == "YES" && "${deleted}" != "YES" && "${status}" != "deleted" && "${kind}" != "storage" ]]; then
                    add_needs_review "NEEDS_REVIEW kind=${kind} reason=proven_test_but_active_reference id=${id} path=${path}"
                    continue
                  fi
                  if [[ "${proven}" == "YES" && "${kind}" == "storage" ]]; then
                    add_safe_delete "${size_bytes:-0}" "SAFE_TO_DELETE kind=storage reason=proven_acceptance_object id=${id} path=${path} size=$(human_bytes "${size_bytes:-0}")"
                    continue
                  fi
                  add_needs_review "NEEDS_REVIEW kind=${kind} reason=uncertain_not_proven_test id=${id} path=${path}"
                  ;;
                project*|asset*|job*|storage*)
                  add_test_orphan "docker ${line}"
                  if is_proven_test_blob "${line}"; then
                    add_safe_delete 0 "SAFE_TO_DELETE kind=docker_row reason=proven_test line=$(printf '%s' "${line}" | tr '\t' ' ' | cut -c1-240)"
                  else
                    add_needs_review "NEEDS_REVIEW kind=docker_row reason=uncertain line=$(printf '%s' "${line}" | tr '\t' ' ' | cut -c1-240)"
                  fi
                  ;;
              esac
            done
          }
          
          audit_db_and_storage() {
            local probe=""
            section "DB AND STORAGE PROBE"
            echo "mode=read_only"
            echo "loadEnvConfig=presence_only_then_query"
            if probe="$(run_db_storage_probe_docker)"; then
              echo "db_probe=docker"
              printf '%s\n' "${probe}"
              classify_probe_hits <<< "${probe}"
              return 0
            fi
            echo "db_probe=docker_unavailable fallback=node"
            if probe="$(run_db_storage_probe_node)"; then
              echo "db_probe=node"
              printf '%s\n' "${probe}"
              classify_probe_hits <<< "${probe}"
              return 0
            fi
            echo "db_probe=unavailable"
            add_needs_review "NEEDS_REVIEW kind=db_storage_probe reason=unavailable"
            return 0
          }
          
          print_final_flags() {
            local recovery
            recovery="$(human_bytes "${SAFE_DELETE_BYTES}")"
            echo "DISK BEFORE = $(printf '%s' "${DISK_BEFORE_TEXT}" | awk 'NR==2{print; exit}')"
            echo "LARGEST DIRECTORIES = $(printf '%s' "${LARGEST_DIRS_TEXT}" | awk 'END{print}' )"
            echo "TEST/ORPHAN FILES FOUND = ${#TEST_ORPHAN_LINES[@]}"
            echo "OLD RELEASES FOUND = ${#OLD_RELEASE_LINES[@]}"
            echo "SAFE TO DELETE = ${#SAFE_DELETE_LINES[@]}"
            echo "ESTIMATED SPACE RECOVERY = ${recovery}"
            echo "CUTOVER = NO"
            echo "audiolad_deploy = NOT_INVOKED"
            echo "MODE = read_only_audit"
          }
          
          run_disk_storage_audit() {
            local current_real=""
            section "DISK_STORAGE_AUDIT"
            echo "mode=read_only_audit"
            echo "audiolad_deploy=NOT_INVOKED"
            echo "CUTOVER=NO"
            echo "ssh_user=$(id -un)"
            if [[ -n "${TARGET_SHA:-}" || -n "${ORIGIN_MAIN_SHA:-}" ]]; then
              section "REQUESTED_SHAS"
              echo "workflow_target_sha=${TARGET_SHA:-}"
              echo "workflow_origin_main_sha=${ORIGIN_MAIN_SHA:-}"
            fi
            unset NEXT_PUBLIC_SUPABASE_URL SUPABASE_SERVICE_ROLE_KEY
          
            section "CURRENT RELEASE"
            if current_real="$(readlink -f "${CURRENT_LINK}")" && [[ -n "${current_real}" ]]; then
              echo "current_link=${CURRENT_LINK}"
              echo "current_realpath=${current_real}"
              echo "CURRENT RELEASE=$(basename "${current_real}")"
            else
              echo "current_link=${CURRENT_LINK}"
              echo "current_realpath=BROKEN"
              echo "CURRENT RELEASE=UNKNOWN"
            fi
          
            audit_disk_before
            audit_largest_directories
            audit_log_sizes
            audit_old_releases
            audit_disk_test_orphans
            audit_db_and_storage
          
            section "TEST/ORPHAN FILES FOUND"
            echo "TEST/ORPHAN FILES FOUND ="
            print_list_or_none TEST_ORPHAN_LINES
          
            section "SAFE TO DELETE"
            echo "SAFE TO DELETE ="
            print_list_or_none SAFE_DELETE_LINES
            echo "note=releases_older_than_current_and_previous_only_for_release_kind"
            echo "note=studio_user_projects_never_marked_safe"
          
            section "NEEDS REVIEW"
            echo "NEEDS REVIEW ="
            print_list_or_none NEEDS_REVIEW_LINES
          
            section "ESTIMATED SPACE RECOVERY"
            echo "ESTIMATED SPACE RECOVERY = $(human_bytes "${SAFE_DELETE_BYTES}")"
          
            section "DISK_STORAGE_AUDIT_END"
            print_final_flags
            return 0
          }
          run_disk_storage_audit
          REMOTE_DISK_AUDIT

      - name: Remove SSH identity
        if: always()
        run: |
          set -euo pipefail
          if [[ -n "${SSH_DIR:-}" ]]; then
            rm -rf "${SSH_DIR}"
          fi

  disk_storage_cleanup:
    name: Ops disk/Storage cleanup
    needs: resolve
    if: inputs.confirm == 'OPS_DISK_STORAGE_CLEANUP'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Prepare SSH identity
        env:
          PRODUCTION_SSH_PRIVATE_KEY: ${{ secrets.PRODUCTION_SSH_PRIVATE_KEY }}
          PRODUCTION_SSH_KNOWN_HOSTS: ${{ secrets.PRODUCTION_SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          set +x
          : "${PRODUCTION_SSH_PRIVATE_KEY:?PRODUCTION_SSH_PRIVATE_KEY secret is required}"
          : "${PRODUCTION_SSH_KNOWN_HOSTS:?PRODUCTION_SSH_KNOWN_HOSTS secret is required}"
          umask 077
          SSH_DIR="$(mktemp -d)"
          KEY_FILE="${SSH_DIR}/id"
          HOSTS_FILE="${SSH_DIR}/known_hosts"
          printf '%s\n' "${PRODUCTION_SSH_PRIVATE_KEY}" > "${KEY_FILE}"
          printf '%s\n' "${PRODUCTION_SSH_KNOWN_HOSTS}" > "${HOSTS_FILE}"
          chmod 0600 "${KEY_FILE}" "${HOSTS_FILE}"
          echo "SSH_DIR=${SSH_DIR}" >> "${GITHUB_ENV}"
          echo "SSH_KEY_FILE=${KEY_FILE}" >> "${GITHUB_ENV}"
          echo "SSH_KNOWN_HOSTS_FILE=${HOSTS_FILE}" >> "${GITHUB_ENV}"

      - name: One-shot allowlist disk/Storage cleanup via SSH
        env:
          PRODUCTION_SSH_HOST: ${{ secrets.PRODUCTION_SSH_HOST }}
          PRODUCTION_SSH_PORT: ${{ secrets.PRODUCTION_SSH_PORT }}
          PRODUCTION_SSH_USER: ${{ secrets.PRODUCTION_SSH_USER }}
          TARGET_SHA: ${{ needs.resolve.outputs.target_sha }}
          ORIGIN_MAIN_SHA: ${{ needs.resolve.outputs.origin_main_sha }}
        run: |
          set -euo pipefail
          : "${PRODUCTION_SSH_HOST:?PRODUCTION_SSH_HOST secret is required}"
          : "${PRODUCTION_SSH_PORT:?PRODUCTION_SSH_PORT secret is required}"
          : "${PRODUCTION_SSH_USER:?PRODUCTION_SSH_USER secret is required}"

          ssh \
            -i "${SSH_KEY_FILE}" \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o UserKnownHostsFile="${SSH_KNOWN_HOSTS_FILE}" \
            -o StrictHostKeyChecking=yes \
            -p "${PRODUCTION_SSH_PORT}" \
            -- \
            "${PRODUCTION_SSH_USER}@${PRODUCTION_SSH_HOST}" \
            "bash -s" "${TARGET_SHA}" "${ORIGIN_MAIN_SHA}" <<'REMOTE_DISK_CLEANUP'
          # One-shot hardcoded allowlist production disk/Storage cleanup for operators / GHA
          # confirm=OPS_DISK_STORAGE_CLEANUP. Deletes ONLY the 13 SAFE TO DELETE items
          # from audit run 34113627251. Never invokes audiolad-deploy / deploy.sh, never
          # does nginx or current/previous symlink cutover, never prints env file
          # contents or secret values, never restarts PM2 / nginx / Docker.
          # Operator/local equivalent:
          #   bash deploy/scripts/audiolad-disk-storage-cleanup.sh
          set -Eeuo pipefail

          if [[ "${#}" -ge 2 && "${1:-}" =~ ^[0-9a-f]{40}$ ]]; then
            TARGET_SHA="$1"
            ORIGIN_MAIN_SHA="$2"
            shift 2
          fi

          DEPLOY_ROOT="${DEPLOY_ROOT:-/var/www/audiolad-deploy}"
          CURRENT_LINK="${DEPLOY_ROOT}/current"
          PREVIOUS_LINK="${DEPLOY_ROOT}/previous"
          RELEASES_DIR="${DEPLOY_ROOT}/releases"
          SHARED_ENV_PRODUCTION="${DEPLOY_ROOT}/shared/.env.production"
          PM2_APP_NAME="audiolad-studio-render-worker"
          CLEANUP_PROJECT_ID="6aa9fd82-7bb6-4df6-8761-6c2f8a1337b4"
          ALLOWLIST_RELEASE_A="20260906-113101-2acc27e1"
          ALLOWLIST_RELEASE_B="20260907-064414-b85c870a"

          CUTOVER="NO"
          AUDIOLAD_DEPLOY="NOT_INVOKED"
          MODE="allowlist_cleanup"
          CLEANUP="PENDING"
          RELEASES_CLEANUP="PENDING"
