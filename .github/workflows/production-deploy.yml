          function metadataNameFields(meta) {
            const obj = metadataObject(meta);
            return Object.keys(obj)
              .filter((key) => /name/i.test(key) && obj[key] != null && obj[key] !== "")
              .map((key) => key + "=" + field(obj[key]))
