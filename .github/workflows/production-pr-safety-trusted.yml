name: Production / PR Safety Runner

on:
  pull_request_target:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:
    inputs:
      pr_number:
        description: Open pull request number targeting main
        required: true
        type: string

permissions:
  contents: read
  pull-requests: read
  statuses: write

concurrency:
  group: production-pr-safety-${{ github.event_name }}-${{ github.event.pull_request.number || inputs.pr_number || github.run_id }}
  cancel-in-progress: true

jobs:
  production-pr-safety-runner:
    name: Production / PR Safety Runner
    if: >-
      github.event_name == 'pull_request_target' ||
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    steps:
      - name: Create trusted main object store
        run: |
          set -euo pipefail
          OBJECT_STORE="$(mktemp -d)"
          TRUSTED_DIR="$(mktemp -d)"
          git -C "${OBJECT_STORE}" init --quiet
          git -C "${OBJECT_STORE}" remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          git -C "${OBJECT_STORE}" fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
          TRUSTED_MAIN_SHA="$(git -C "${OBJECT_STORE}" rev-parse refs/remotes/origin/main)"
          git -C "${OBJECT_STORE}" show \
            "${TRUSTED_MAIN_SHA}:scripts/production-pr-safety-guard.mjs" \
            > "${TRUSTED_DIR}/production-pr-safety-guard.mjs"
          git -C "${OBJECT_STORE}" show \
            "${TRUSTED_MAIN_SHA}:scripts/production-pr-safety-status.mjs" \
            > "${TRUSTED_DIR}/production-pr-safety-status.mjs"
          printf 'OBJECT_STORE=%s\n' "${OBJECT_STORE}" >> "${GITHUB_ENV}"
          printf 'TRUSTED_DIR=%s\n' "${TRUSTED_DIR}" >> "${GITHUB_ENV}"
          printf 'TRUSTED_MAIN_SHA=%s\n' "${TRUSTED_MAIN_SHA}" >> "${GITHUB_ENV}"

      - name: Resolve and validate current main and PR head
        id: refs
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number || inputs.pr_number }}
        run: |
          set -euo pipefail
          if [[ ! "$PR_NUMBER" =~ ^[0-9]+$ ]]; then
            echo "BLOCK: pr_number must contain digits only" >&2
            exit 1
          fi
          pr_json="$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}")"
          main_sha="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/main" --jq '.object.sha')"
          pr_sha="$(jq -r '.head.sha' <<<"$pr_json")"
          pr_clone_url="$(jq -r '.head.repo.clone_url' <<<"$pr_json")"
          pr_state="$(jq -r '.state' <<<"$pr_json")"
          pr_base_ref="$(jq -r '.base.ref' <<<"$pr_json")"
          if [[ "$pr_state" != "open" ]]; then
            echo "BLOCK: PR #${PR_NUMBER} is not open" >&2
            exit 1
          fi
          if [[ "$pr_base_ref" != "main" ]]; then
            echo "BLOCK: PR #${PR_NUMBER} must target main (got ${pr_base_ref})" >&2
            exit 1
          fi
          if [[ ! "$main_sha" =~ ^[0-9a-fA-F]{40}$ ]] || [[ ! "$pr_sha" =~ ^[0-9a-fA-F]{40}$ ]]; then
            echo "BLOCK: GitHub API returned malformed main or PR SHA" >&2
            exit 1
          fi
          if [[ ! "$pr_clone_url" =~ ^https://github\.com/ ]]; then
            echo "BLOCK: GitHub API returned an invalid PR head clone URL" >&2
            exit 1
          fi
          git -C "${OBJECT_STORE}" fetch --no-tags origin "$main_sha"
          git -C "${OBJECT_STORE}" fetch --no-tags "$pr_clone_url" "$pr_sha"
          printf 'main_sha=%s\n' "$main_sha" >> "$GITHUB_OUTPUT"
          printf 'pr_sha=%s\n' "$pr_sha" >> "$GITHUB_OUTPUT"
          printf 'pr_state=%s\n' "$pr_state" >> "$GITHUB_OUTPUT"
          printf 'pr_base_ref=%s\n' "$pr_base_ref" >> "$GITHUB_OUTPUT"

      - name: Set trusted status pending on PR head
        id: pending
        if: github.event_name == 'pull_request_target' && steps.refs.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_SHA: ${{ steps.refs.outputs.pr_sha }}
        run: |
          gh api --method POST "repos/${GITHUB_REPOSITORY}/statuses/${PR_SHA}" \
            -f state=pending \
            -f context='Production / PR Safety' \
            -f description='Trusted production lineage check is running'

      - name: Re-read main immediately before verdict
        id: final-main
        if: steps.refs.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          main_sha="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/main" --jq '.object.sha')"
          if [[ ! "$main_sha" =~ ^[0-9a-fA-F]{40}$ ]]; then
            echo "BLOCK: GitHub API returned malformed final main SHA" >&2
            exit 1
          fi
          printf 'main_sha=%s\n' "$main_sha" >> "$GITHUB_OUTPUT"

      - name: Evaluate trusted production and PR safety
        id: guard
        if: steps.refs.outcome == 'success' && steps.final-main.outcome == 'success'
        env:
          PR_SAFETY_MAIN_SHA: ${{ steps.refs.outputs.main_sha }}
          PR_SAFETY_FINAL_MAIN_SHA: ${{ steps.final-main.outputs.main_sha }}
          PR_SAFETY_PR_SHA: ${{ steps.refs.outputs.pr_sha }}
          PR_SAFETY_PR_NUMBER: ${{ github.event.pull_request.number || inputs.pr_number }}
          PR_SAFETY_PR_STATE: ${{ steps.refs.outputs.pr_state }}
          PR_SAFETY_PR_BASE_REF: ${{ steps.refs.outputs.pr_base_ref }}
          PR_SAFETY_WORKFLOW_SHA: ${{ github.sha }}
          AUDIOLAD_PRODUCTION_HEALTH_URL: https://audiolad.ru/api/health/build
        run: |
          cd "${OBJECT_STORE}"
          node "${TRUSTED_DIR}/production-pr-safety-guard.mjs"

      - name: Resolve final trusted status
        id: final-status
        if: always() && github.event_name == 'pull_request_target' && steps.refs.outcome == 'success'
        env:
          GUARD_STATE: ${{ steps.guard.outputs.status_state }}
          GUARD_OUTCOME: ${{ steps.guard.outcome }}
        run: node "${TRUSTED_DIR}/production-pr-safety-status.mjs"

      - name: Set final trusted status on PR head
        if: always() && github.event_name == 'pull_request_target' && steps.refs.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_SHA: ${{ steps.refs.outputs.pr_sha }}
          STATUS_STATE: ${{ steps.final-status.outputs.state }}
          STATUS_DESCRIPTION: ${{ steps.final-status.outputs.description }}
          RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          gh api --method POST "repos/${GITHUB_REPOSITORY}/statuses/${PR_SHA}" \
            -f state="$STATUS_STATE" \
            -f context='Production / PR Safety' \
            -f description="$STATUS_DESCRIPTION" \
            -f target_url="$RUN_URL"

      - name: Remove trusted temporary stores
        if: always()
        run: rm -rf "${OBJECT_STORE}" "${TRUSTED_DIR}"
