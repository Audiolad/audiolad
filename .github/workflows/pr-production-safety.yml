name: Production / PR Safety

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
  pull_request_target:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:
    inputs:
      pr_number:
        description: Pull request number to check
        required: true
        type: string

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: production-pr-safety-${{ github.event_name }}-${{ github.event.pull_request.number || inputs.pr_number || github.run_id }}
  cancel-in-progress: true

jobs:
  production-pr-safety:
    name: Production / PR Safety
    if: >-
      github.event_name == 'pull_request_target' ||
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout current main history
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false

      - name: Resolve current main and PR head
        id: refs
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number || inputs.pr_number }}
        run: |
          set -euo pipefail
          if [[ ! "$PR_NUMBER" =~ ^[0-9]+$ ]]; then
            echo "BLOCK: pr_number must contain digits only" >&2
            exit 1
          fi
          pr_json="$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}")"
          main_sha="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/main" --jq '.object.sha')"
          pr_sha="$(jq -r '.head.sha' <<<"$pr_json")"
          pr_clone_url="$(jq -r '.head.repo.clone_url' <<<"$pr_json")"
          pr_state="$(jq -r '.state' <<<"$pr_json")"
          pr_base_ref="$(jq -r '.base.ref' <<<"$pr_json")"
          if [[ "$pr_state" != "open" ]]; then
            echo "BLOCK: PR #${PR_NUMBER} is not open" >&2
            exit 1
          fi
          if [[ "$pr_base_ref" != "main" ]]; then
            echo "BLOCK: PR #${PR_NUMBER} must target main (got ${pr_base_ref})" >&2
            exit 1
          fi
          if [[ ! "$main_sha" =~ ^[0-9a-fA-F]{40}$ ]] || [[ ! "$pr_sha" =~ ^[0-9a-fA-F]{40}$ ]]; then
            echo "BLOCK: GitHub API returned malformed main or PR SHA" >&2
            exit 1
          fi
          if [[ ! "$pr_clone_url" =~ ^https://github\.com/ ]]; then
            echo "BLOCK: GitHub API returned an invalid PR head clone URL" >&2
            exit 1
          fi
          git fetch --no-tags origin "$main_sha"
          git fetch --no-tags "$pr_clone_url" "$pr_sha"
          printf 'main_sha=%s\n' "$main_sha" >> "$GITHUB_OUTPUT"
          printf 'pr_sha=%s\n' "$pr_sha" >> "$GITHUB_OUTPUT"
          printf 'pr_state=%s\n' "$pr_state" >> "$GITHUB_OUTPUT"
          printf 'pr_base_ref=%s\n' "$pr_base_ref" >> "$GITHUB_OUTPUT"

      - name: Re-read main immediately before verdict
        id: final-main
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          main_sha="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/main" --jq '.object.sha')"
          if [[ ! "$main_sha" =~ ^[0-9a-fA-F]{40}$ ]]; then
            echo "BLOCK: GitHub API returned malformed final main SHA" >&2
            exit 1
          fi
          printf 'main_sha=%s\n' "$main_sha" >> "$GITHUB_OUTPUT"

      - name: Evaluate production and PR safety
        env:
          PR_SAFETY_MAIN_SHA: ${{ steps.refs.outputs.main_sha }}
          PR_SAFETY_FINAL_MAIN_SHA: ${{ steps.final-main.outputs.main_sha }}
          PR_SAFETY_PR_SHA: ${{ steps.refs.outputs.pr_sha }}
          PR_SAFETY_PR_NUMBER: ${{ github.event.pull_request.number || inputs.pr_number }}
          PR_SAFETY_PR_STATE: ${{ steps.refs.outputs.pr_state }}
          PR_SAFETY_PR_BASE_REF: ${{ steps.refs.outputs.pr_base_ref }}
          PR_SAFETY_WORKFLOW_SHA: ${{ github.sha }}
          AUDIOLAD_PRODUCTION_HEALTH_URL: https://audiolad.ru/api/health/build
        run: node scripts/production-pr-safety-guard.mjs

  pr-repository-validation:
    name: PR Repository Validation
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR head for ordinary validation
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Install dependencies
        run: npm ci

      - name: Validate PR repository
        run: |
          npm run test:database-migrations
          npm run build
          npm run typecheck
          npm run lint
