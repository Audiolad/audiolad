name: Audiolad Business Validation

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

concurrency:
  group: audiolad-business-validation-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  business-validation:
    name: Audiolad Business Validation
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Start disposable onboarding SQL database
        run: |
          docker run --detach --name audiolad-onboarding-test-ci \
            -e POSTGRES_HOST_AUTH_METHOD=trust postgres:16
          for attempt in $(seq 1 30); do
            if docker exec audiolad-onboarding-test-ci pg_isready -U postgres; then exit 0; fi
            sleep 1
          done
          exit 1

      - name: Validate Audiolad Business
        run: |
          set -euo pipefail
          npx tsx scripts/business-landing-unit.mts
          npm run test:business-app-domain-bind
          npm run test:business-app-proxy-routing
          AUDIOLAD_REQUIRE_GUEST_COFFEE_SQL=1 AUDIOLAD_ONBOARDING_TEST_CONTAINER=audiolad-onboarding-test-ci npm run test:business-guest-coffee
          npm run test:business-guest-shell
          npm run test:business-guest-atmosphere
          npm run test:business-guest-passport
          npm run test:business-brand-icons
          npm run test:business-app-venue-player
          npm run test:business-app-eligibility
          npm run test:business-app-owner-home-signals
          npm run test:business-app-support-diagnostics
          npm run test:business-app-client-documents
          npm run test:business-app-onboarding-wizard
          npm run test:business-domain-core
          npm run test:business-player-foundation
          npm run test:business-playback-attribution
          npm run test:business-rights-foundation
          npm run test:business-rights-eligibility
          AUDIOLAD_REQUIRE_ONBOARDING_SQL=1 AUDIOLAD_ONBOARDING_TEST_CONTAINER=audiolad-onboarding-test-ci npm run test:business-rightsholder-onboarding
          AUDIOLAD_REQUIRE_ONBOARDING_SQL=1 AUDIOLAD_ONBOARDING_TEST_CONTAINER=audiolad-onboarding-test-ci npm run test:support-consent-block
          AUDIOLAD_REQUIRE_ONBOARDING_SQL=1 AUDIOLAD_ONBOARDING_TEST_CONTAINER=audiolad-onboarding-test-ci npm run test:business-owner-self-moderation
          npm run test:admin-business-verification
          AUDIOLAD_REQUIRE_ONBOARDING_SQL=1 AUDIOLAD_ONBOARDING_TEST_CONTAINER=audiolad-onboarding-test-ci npm run test:unified-agreement
          npm run test:business-rightsholder-examples-ui
          npm run test:business-consent-document-links
          npm run test:business-evidence-file-field
          npm run test:author-business-tab
          npm run test:business-agreement-workspace-link
          npm run test:business-status-no-track-list
          AUDIOLAD_SKIP_ISOLATED_SQL=1 npm run test:business-spa-programs
          AUDIOLAD_SKIP_ISOLATED_SQL=1 npm run test:business-spa-composition
          AUDIOLAD_SKIP_ISOLATED_SQL=1 npm run test:business-royalty-ledger
          npm run test:business-spa-manifest
          npm run test:business-spa-admin
          npm run test:business-spa-player-core
          npm run test:business-spa-player-engine

      - name: Remove disposable onboarding SQL database
        if: always()
        run: docker rm --force audiolad-onboarding-test-ci
